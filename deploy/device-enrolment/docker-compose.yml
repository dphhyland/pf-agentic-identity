# Local demo run: Postgres plus the DEMO variant of the enrolment service (Dockerfile.demo, entry
# point DemoServerMain — not the production Dockerfile/Main), with the schema applied on first start.
#
#   docker compose -f deploy/device-enrolment/docker-compose.yml up --build
#   java -cp phone-simulator/target/phone-simulator-0.1.0.jar:phone-simulator/target/dependency/* \
#     com.pingidentity.ps.oidf.demo.phonesim.PhoneSimulatorCli --id-token <a real PingOne ID token>
#
# See phone-simulator/README.md in pf-agentic-identity-domain-authority for what the demo server substitutes (a synthetic, bundled App
# Attest trust root — the one thing that cannot come from anywhere but a physical iPhone) and how to
# obtain a real PingOne ID token to drive the green path. PingOne is wired for real here, matching
# staging (deploy/device-enrolment/vars.staging.env) — user_authentication is verified for real,
# so a fabricated evidence string is correctly refused rather than silently accepted.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enrolment
      POSTGRES_PASSWORD: enrolment
      POSTGRES_DB: enrolment
    # A local stand-in for the Identity Object Model directory. The model's migrations are mounted into
    # the image's init directory and run in filename order (0000 < 002 < 006), so a fresh volume comes
    # up with the agent-instance classes registered. Postgres runs these only when the data directory
    # is empty; drop the volume to re-apply. These files are the vendored copies the registry's tests
    # use — refresh them from ~/Source/idp-scim-service/migrations when the model changes.
    volumes:
      - ../../libs/device-instance/src/test/resources/idm:/docker-entrypoint-initdb.d:ro
      - enrolment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrolment -d enrolment"]
      interval: 3s
      timeout: 3s
      retries: 20

  device-enrolment:
    build:
      context: ../..
      dockerfile: deploy/device-enrolment/Dockerfile.demo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port 8180, not 8080: several other local stacks on this machine already bind 8080.
      - "8180:8080"
    environment:
      ENROLMENT_ISSUER: http://localhost:8180
      IDM_DATABASE_URL: jdbc:postgresql://postgres:5432/enrolment?user=enrolment&password=enrolment
      # No APPLE_TEAM_ID / APPLE_BUNDLE_ID here: the demo server's App ID is fixed to
      # AppAttestFixtures.TEAM_ID/BUNDLE_ID so it can never drift from what phone-simulator builds.
      APPLE_ALLOW_DEVELOPMENT: "true"
      UV_MAX_AGE_SECONDS: "300"
      # Off locally only so the flow can be walked without an MDM attached. It is on in both
      # deployed environments, because "never assessed" must not mean "fine".
      REQUIRE_COMPLIANT_DEVICE: "false"
      # The RFC 7515 Appendix A.3.1 example key — deliberately one whose private half is published in
      # an RFC, so it is obviously worthless and nobody can mistake it for a real attester key.
      # Generate your own for anything that leaves your laptop.
      ENROLMENT_SIGNING_JWK: >-
        {"kty":"EC","crv":"P-256","kid":"local-dev-1",
         "x":"f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU",
         "y":"x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0",
         "d":"jpsQnnGQmL-YBIffH1136cspYG6-0iY7X1fCE9-E9LI"}
      # PingOne — environment fe8ab8dc-0dbb-4da4-8ee5-004cb3a6f21d ("P1AS", region AP), matching
      # deploy/device-enrolment/vars.staging.env exactly. See that file for why this specific app,
      # and pf-agentic-identity-domain-authority's phone-simulator/README.md for how to obtain a real ID token to authenticate against it.
      PINGONE_ISSUER: https://auth.pingone.asia/fe8ab8dc-0dbb-4da4-8ee5-004cb3a6f21d/as
      PINGONE_CLIENT_ID: fad0652e-61bd-4531-ba1a-ff7074f1939b
      PINGONE_ACR_AAL2: Bank_Signup_Passkey

volumes:
  enrolment-data:
