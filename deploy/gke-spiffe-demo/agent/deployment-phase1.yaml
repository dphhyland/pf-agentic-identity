# Phase 1 agent: SPIRE-attested. The spiffe-csi driver projects the Workload API socket into the pod;
# the ClusterSPIFFEID (spire/clusterspiffeid.yaml) registers app=payment-agent pods as
# spiffe://gke.banking.demo/ns/demo/sa/payment-agent.
# Replace IMAGE:  sed "s|IMAGE|<registry>/agent:demo|" deployment-phase1.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-agent
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-agent
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-agent
  template:
    metadata:
      labels:
        app: payment-agent
    spec:
      serviceAccountName: payment-agent
      containers:
        - name: agent
          image: IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: ATTESTER_BASE_URL
              value: "http://pingfederate.pf:9080"
            - name: CLIENT_ID
              value: "demo-attest-gke"
            - name: CLIENT_SECRET
              value: "demo-secret-123" # demo-only; the attestation is the real client auth
            - name: EVIDENCE_MODE
              value: "spiffe-jwt"
            # PF checks the PoP aud against ITS configured base URL (from data.zip), not the request URL.
            - name: PF_TOKEN_AUD
              value: "https://localhost:9031"
            # Socket name must match the spiffe-csi mount below (verify against the SPIRE helm values).
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///spiffe-workload-api/spire-agent.sock"
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
