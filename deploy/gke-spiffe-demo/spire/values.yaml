# Minimal SPIRE install for the demo (spiffe/spire hardened chart).
#
#   helm repo add spiffe https://spiffe.github.io/helm-charts-hardened/
#   helm upgrade --install spire-crds spiffe/spire-crds -n spire-mgmt --create-namespace
#   helm upgrade --install spire spiffe/spire -n spire-mgmt -f values.yaml
#
# Installs spire-server, the spire-agent DaemonSet (1 node → 1 agent), the SPIFFE CSI driver that
# projects the Workload API socket into pods, and the controller-manager that turns ClusterSPIFFEID
# CRDs into registration entries. JWT-SVID issuance is inherent to the Workload API — no extra flag.
global:
  spire:
    trustDomain: gke.banking.demo
    clusterName: spiffe-demo
