# ClusterIP only — nothing is exposed publicly. The agent reaches the runtime at
# http://pingfederate.pf.svc.cluster.local:9080 (short: http://pingfederate.pf:9080); the admin API is
# reached from the laptop via `kubectl -n pf port-forward svc/pingfederate 9999:9999`.
apiVersion: v1
kind: Service
metadata:
  name: pingfederate
  namespace: pf
spec:
  selector:
    app: pingfederate
  ports:
    - name: runtime
      port: 9080
      targetPort: 9080
    - name: admin
      port: 9999
      targetPort: 9999
