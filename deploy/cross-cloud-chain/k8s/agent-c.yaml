# Agent C — the delivery agent, on GKE, with its OWN service account so it is a distinct actor in
# the delegation chain (client demo-attest-gke-delivery). Publicly reachable because agent B calls
# it from AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-agent
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-agent-c
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: chain-agent-c }
  template:
    metadata:
      labels: { app: chain-agent-c }
    spec:
      serviceAccountName: delivery-agent
      containers:
        - name: agent
          image: IMAGE_C
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ROLE, value: "C" }
            - { name: ATTESTER_BASE_URL, value: "http://pingfederate.pf:9080" }
            - { name: TOKEN_FILE, value: "/var/run/secrets/tokens/attester-token" }
            - { name: EXCHANGE_BASE_URL, value: "EKS_PF_URL" }
            - { name: NEXT_HOP_URL, value: "RESOURCE_URL" }
          volumeMounts:
            - { name: attester-token, mountPath: /var/run/secrets/tokens, readOnly: true }
      volumes:
        - name: attester-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "https://attester.example.com"
                  expirationSeconds: 3600
                  path: attester-token
---
apiVersion: v1
kind: Service
metadata:
  name: chain-agent-c
  namespace: demo
spec:
  type: LoadBalancer
  selector: { app: chain-agent-c }
  ports: [{ port: 80, targetPort: 8080 }]
