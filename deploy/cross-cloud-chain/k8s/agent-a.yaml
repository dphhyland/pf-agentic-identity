# Agent A — the originator, on GKE. Reuses the payment-agent service account, so it resolves to
# client demo-attest-gke-native and the chain starts from spiffe://…/ns/demo/sa/payment-agent.
#
# The aws-invoke secret holds an AWS access key used ONLY to reach the AgentCore control API — the
# transport to agent B. It is not an identity credential: A's identity to PingFederate is still its
# attestation, and B's identity to PingFederate is still B's own attestation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chain-agent-a
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: chain-agent-a }
  template:
    metadata:
      labels: { app: chain-agent-a }
    spec:
      serviceAccountName: payment-agent
      containers:
        - name: agent
          image: IMAGE_A
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ROLE, value: "A" }
            - { name: ATTESTER_BASE_URL, value: "http://pingfederate.pf:9080" }
            - { name: TOKEN_FILE, value: "/var/run/secrets/tokens/attester-token" }
            - { name: AGENTCORE_ARN, value: "AGENTCORE_ARN_VALUE" }
            - { name: AWS_REGION, value: "ap-southeast-2" }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: aws-invoke, key: access-key-id } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: aws-invoke, key: secret-access-key } }
          volumeMounts:
            - { name: attester-token, mountPath: /var/run/secrets/tokens, readOnly: true }
      volumes:
        - name: attester-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "https://attester.example.com"
                  expirationSeconds: 3600
                  path: attester-token
---
apiVersion: v1
kind: Service
metadata:
  name: chain-agent-a
  namespace: demo
spec:
  type: LoadBalancer
  selector: { app: chain-agent-a }
  ports: [{ port: 80, targetPort: 8080 }]
