# PingFederate on EKS. Same image as the GKE demo (baked-aws: attester + ClientAttestationAuthFilter +
# the two AWS validators, config baked into data.zip), pushed to ECR so EKS can pull it. Set IMAGE to the
# ECR ref before applying. Needs the pf-devops-license and pf-bridge-key secrets (copy them from the GKE
# cluster, or recreate). Single replica (in-memory challenge/replay store).
apiVersion: v1
kind: Namespace
metadata:
  name: pf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingfederate
  namespace: pf
spec:
  replicas: 1
  selector:
    matchLabels: { app: pingfederate }
  template:
    metadata:
      labels: { app: pingfederate }
    spec:
      containers:
        - name: pingfederate
          image: IMAGE
          ports:
            - { name: runtime, containerPort: 9080 }
            - { name: admin, containerPort: 9999 }
          envFrom:
            - secretRef: { name: pf-devops-license }
          env:
            - name: OIDF_BRIDGE_PRIVATE_JWK
              valueFrom:
                secretKeyRef: { name: pf-bridge-key, key: private-jwk }
          resources:
            requests: { cpu: "1", memory: 3Gi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe:
            httpGet: { path: /pf/heartbeat.ping, port: 9080 }
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /pf/heartbeat.ping, port: 9080 }
            initialDelaySeconds: 300
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pingfederate
  namespace: pf
spec:
  selector: { app: pingfederate }
  ports:
    - { name: runtime, port: 9080, targetPort: 9080 }
    - { name: admin, port: 9999, targetPort: 9999 }
