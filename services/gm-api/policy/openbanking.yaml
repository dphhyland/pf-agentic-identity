name: open-banking-consent
description: >
  Demo Open Banking policy for the Grant Evaluation API. Authority comes from the
  grant, not from this file: the GM API passes the grant's scopes and RFC 9396
  authorization_details down in the AuthZEN request context, and the PDP checks
  the request against them. This file only says which authorization_details type
  governs which resource type, and what each action costs in scope.

resources:
  # An account is governed by the account_information consent. The consented
  # account numbers may be listed either as RAR locations or under data.accounts.
  account:
    authorization_details_type: account_information
    id_paths:
      - locations
      - data.accounts

  # A payment is governed by the payment_initiation consent.
  payment:
    authorization_details_type: payment_initiation
    id_paths:
      - locations
      - data.payment_ids

actions:
  read_balance:
    requires_scope: accounts.read

  read_transactions:
    requires_scope: accounts.read

  # Payments carry a consented ceiling as well as a scope.
  initiate_payment:
    requires_scope: payments.write
    max_amount: 1000
