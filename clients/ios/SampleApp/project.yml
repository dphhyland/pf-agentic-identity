# XcodeGen spec for the sample app. SampleApp.xcodeproj is generated from this file and committed, so neither CI
# nor a reader needs XcodeGen; after changing this file, run `xcodegen generate` here and commit both.
#
# DEVELOPMENT_TEAM is empty and the bundle id is a placeholder: signing for a device needs your team and an App ID
# with the App Attest capability (README.md). A simulator build needs neither (CODE_SIGNING_ALLOWED=NO), which is
# how .github/workflows/ios.yml builds it.
name: SampleApp
options:
  bundleIdPrefix: com.example.agentidentity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  projectFormat: xcode15_0
packages:
  AgentIdentityKit:
    path: ../AgentIdentityKit
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SampleApp:
    type: application
    platform: iOS
    sources:
      - path: SampleApp
    dependencies:
      - package: AgentIdentityKit
    entitlements:
      path: SampleApp/SampleApp.entitlements
      properties:
        # Apple, "App Attest Environment" (read 2026-09-27): development or production; a TestFlight, App Store or
        # Enterprise build ignores it and uses production.
        com.apple.developer.devicecheck.appattest-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.agentidentity.sample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agent Identity
        # The instance key is created behind .userPresence, so a key proof can ask for Face ID.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks the key this iPhone signs the agent's key proofs with.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
