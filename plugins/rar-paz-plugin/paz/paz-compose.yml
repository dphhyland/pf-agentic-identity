# A PingAuthorize Policy Editor for the RAR processor's reference policies (paz/policies), their authoring
# (author-policies.py) and their decision tests (decision-tests.py). Nothing here is a secret, and nothing needs a
# checkout beside this one:
#   - the licence is Ping's evaluation licence, which the image fetches at start with PING_IDENTITY_DEVOPS_USER and
#     PING_IDENTITY_DEVOPS_KEY from $PING_DEVOPS_CONFIG (default ~/.pingidentity/config, as conformance/up.sh reads it);
#   - the decision point shared secret is yours: set PAZ_DECISION_SECRET when you bring it up, and give the scripts
#     the same value (PAZ_DECISION_SECRET or PAZ_DECISION_SECRET_FILE). There is no default.
#
#   PAZ_DECISION_SECRET="$(openssl rand -hex 24)" docker compose -f paz-compose.yml up -d
#
# PAZ_PAP_PORT (default 7443) is the host port of the Policy Editor's 1443. The image is 11.1.0.0; the policies use
# only the Trust Framework, rules, policies, statements and a policy set, which 10.2 has as well.
services:
  pap:
    image: pingidentity/pingauthorizepap:11.1.0.0-latest
    container_name: ${PAZ_PAP_NAME:-rar-paz-pap}
    ports:
      - "${PAZ_PAP_PORT:-7443}:1443"
    env_file:
      - path: ${PING_DEVOPS_CONFIG:-${HOME}/.pingidentity/config}
        required: true
    environment:
      PING_IDENTITY_ACCEPT_EULA: "YES"
      PING_EXTERNAL_BASE_URL: localhost:${PAZ_PAP_PORT:-7443}
      DECISION_POINT_SHARED_SECRET: ${PAZ_DECISION_SECRET:?set PAZ_DECISION_SECRET - there is no default}
