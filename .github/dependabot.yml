# Dependabot version updates (docs.github.com, "Dependabot options reference", read 2026-09-27): weekly on
# Mondays, a week after a version is published (the cooldown: a release pulled or found malicious in its first
# days never arrives here), one pull request per group, and never for a version PingFederate decides. Its pull
# requests merge like every other one here: a merge commit, never a squash (auto-merge, when used, with merge
# as the method). Dependabot alerts and security updates are repository settings David turns on; this file
# configures version updates only.
version: 2
updates:
  # The reactor. Dependabot reads the root pom and follows every <module> to its pom (dependabot-core's Maven
  # file fetcher, read 2026-09-27), so one entry covers the twenty poms and the BOM. Ignored, because they follow
  # PingFederate and not Maven Central:
  #   version.pf.* in bom/pom.xml - jose4j, jackson (version.jackson follows it, and jackson-dataformat-cbor
  #     with it), commons-lang3, commons-logging and log4j: the libraries PingFederate 13.1.3 ships on its own
  #     classpath, which tools/pf-provided-versions.py holds the BOM to;
  #   jakarta.servlet-api - the servlet line PingFederate 13.1's Jetty (ee9) implements;
  #   the two PingFederate jars themselves (pingfederate:pf-protocolengine, com.pingidentity.pingfederate:
  #     pingfederate-sdk), installed from the image by .github/actions/pf-provided-jars under the version
  #     build/pf-version.env names.
  # Minor and patch updates arrive as one pull request; a major update gets its own.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "org.bitbucket.b_c:jose4j"
      - dependency-name: "com.fasterxml.jackson.*"
      - dependency-name: "org.apache.commons:commons-lang3"
      - dependency-name: "commons-logging:commons-logging"
      - dependency-name: "org.apache.logging.log4j:*"
      - dependency-name: "jakarta.servlet:jakarta.servlet-api"
      - dependency-name: "pingfederate:*"
      - dependency-name: "com.pingidentity.pingfederate:*"
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  # The workflows' actions, pinned to commits with the tag beside them: Dependabot moves the commit and the
  # comment together. One pull request for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The image's FROM: pingidentity/pingfederate by tag and digest. A bump here is a PingFederate upgrade -
  # tools/pf-version-sync.py rewrites build/pf-version.env from it, and tools/pf-version-check.py fails the
  # build until everything that names a PingFederate agrees.
  - package-ecosystem: docker
    directory: /build/pingfederate
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # tools/package.json: marked, pinned for tools/build-showcase-docs.mjs (another version renders differently,
  # and the showcase check would fail on every document until it is regenerated).
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # The rig's provider: conformance/terraform/versions.tf and the committed lock file.
  - package-ecosystem: terraform
    directory: /conformance/terraform
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
