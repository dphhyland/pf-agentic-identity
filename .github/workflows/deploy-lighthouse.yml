# Push-to-deploy for the OpenID Federation trust anchor (go-oidfed lighthouse), config-as-code.
# Fires only when deploy/lighthouse/** changes. Applies vars.<env>.env, then `railway up`s the
# pinned image. Monorepo mapping: push to main → STAGING; production only via workflow_dispatch (explicit).
# Requires the two project tokens already in repo secrets (RAILWAY_TOKEN_STAGING / _PROD).
#
# NOTE the service-name skew this inherits: the staging service is `lighthouse`, the production
# service is `lighthouse-prod` (the CLI could not add a same-named service to a second env). The
# per-env jobs below carry the right name; unifying the names is a tracked follow-up in deploy/README.md.
name: Deploy lighthouse (trust anchor)

on:
  push:
    branches: [main]
    paths:
      - deploy/lighthouse/**
      - .github/workflows/deploy-lighthouse.yml
  workflow_dispatch:
    inputs:
      environment:
        description: deploy target (only 'production' does anything)
        required: true
        default: production

permissions:
  contents: read

# Never let two deploys of the same service+environment race: `railway up` is last-write-wins, and
# two in-flight uploads can land in either order, so the service can end up running the older one.
# Not cancel-in-progress - a half-finished deploy is worse than a queued one.
concurrency:
  group: deploy-lighthouse-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A real GitHub Environment, not the dispatch input of the same name: this is what scopes
    # RAILWAY_TOKEN_* to the environment and what protection rules attach to.
    environment: staging
    defaults: { run: { working-directory: deploy/lighthouse } }
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g @railway/cli@5.41.2
      - name: apply config + deploy → lighthouse (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          SERVICE: lighthouse
          VARS: vars.staging.env
        run: |
          setargs=(); while IFS= read -r l; do [[ "$l" =~ ^[[:space:]]*# || -z "${l// }" ]] && continue; setargs+=(--set "$l"); done < "$VARS"
          railway variables --service "$SERVICE" "${setargs[@]}"
          railway up --ci --service "$SERVICE"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in repo settings and production deploys stop
    # being one dispatch click by anyone with write access.
    environment: production
    defaults: { run: { working-directory: deploy/lighthouse } }
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g @railway/cli@5.41.2
      - name: apply config + deploy → lighthouse-prod (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
          SERVICE: lighthouse-prod
          VARS: vars.production.env
        run: |
          setargs=(); while IFS= read -r l; do [[ "$l" =~ ^[[:space:]]*# || -z "${l// }" ]] && continue; setargs+=(--set "$l"); done < "$VARS"
          railway variables --service "$SERVICE" "${setargs[@]}"
          railway up --ci --service "$SERVICE"
