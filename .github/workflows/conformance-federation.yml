# The OpenID Foundation suite's OpenID Federation deployed-entity plan (release-v5.3.1, alpha) against this
# repo's PingFederate, built from the clone as conformance/README.md describes: PF_PROFILE=federation, PF its
# own trust anchor. Weekly and by hand, never on a push - it takes a quarter of an hour and a licence.
#
# The licence is yours: set the repository secrets PING_IDENTITY_DEVOPS_USER and PING_IDENTITY_DEVOPS_KEY
# (https://devops.pingidentity.com/how-to/devopsRegistration/). Without them the run stops at the first step.
#
# The OP plan (PF_PROFILE=federation-op) stays a local run for now: the suite hosts a relying party and a trust
# anchor that PingFederate fetches from, which needs the suite's certificate and name arranged as the README says.
name: Conformance (OpenID Federation)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # Mondays, 03:17 UTC

env:
  PF_IMAGE: pingidentity/pingfederate:13.1.3-alpine_3.24.1-al21-latest
  # The suite reaches PF by its container name, over the rig's network (see "the suite, on PF's network"): on
  # Linux a port published on 127.0.0.1 can't be reached from another container through the host gateway.
  PF_BASE_URL: https://pf-agentic-identity:9031

permissions:
  contents: read

concurrency:
  group: conformance-federation
  cancel-in-progress: false

jobs:
  deployed-entity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - name: extract provided PF jars from the image
        uses: ./.github/actions/pf-provided-jars
        with: { image: "${{ env.PF_IMAGE }}" }
      - name: licence details, from the repository's secrets
        env:
          DEVOPS_USER: ${{ secrets.PING_IDENTITY_DEVOPS_USER }}
          DEVOPS_KEY: ${{ secrets.PING_IDENTITY_DEVOPS_KEY }}
        run: |
          if [ -z "$DEVOPS_USER" ] || [ -z "$DEVOPS_KEY" ]; then
            echo "::error::PingFederate needs a licence: set the repository secrets PING_IDENTITY_DEVOPS_USER and PING_IDENTITY_DEVOPS_KEY"
            exit 1
          fi
          mkdir -p ~/.pingidentity
          ( umask 077 && printf 'PING_IDENTITY_DEVOPS_USER=%s\nPING_IDENTITY_DEVOPS_KEY=%s\n' "$DEVOPS_USER" "$DEVOPS_KEY" > ~/.pingidentity/config )
      - name: PingFederate, its own trust anchor
        working-directory: conformance
        env:
          PF_PROFILE: federation
        run: ./up.sh
      - name: the suite, on PF's network
        working-directory: conformance
        run: |
          SUITE_PORT=9643 docker compose -f suite/suite-compose.yml -p suite up -d
          docker network connect conformance_default suite-server-1
          for _ in $(seq 1 60); do
            curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://localhost:9643/ | grep -q 200 && exit 0
            sleep 5
          done
          echo "::error::the suite did not answer on 9643 within five minutes"
          docker compose -f suite/suite-compose.yml -p suite logs server | tail -50
          exit 1
      - name: openid-federation-deployed-entity-test-plan
        working-directory: conformance
        run: |
          set -o pipefail   # the plan's exit status, not tee's
          PF_LOCAL_URL=https://localhost:9031 suite/render.sh
          suite/run-plan.py https://localhost:9643 openid-federation-deployed-entity-test-plan suite/federation-deployed-entity.json \
            --variant server_metadata=discovery client_registration=automatic | tee deployed-entity.txt
      - name: PingFederate's logs, when anything failed
        if: failure()
        run: docker logs pf-agentic-identity > conformance/pingfederate.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: federation-deployed-entity
          path: |
            conformance/deployed-entity.txt
            conformance/pingfederate.log
          if-no-files-found: ignore
