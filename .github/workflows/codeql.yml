# CodeQL over what this repository is written in: the Java reactor, built as CodeQL watches; the workflows
# themselves; the Python tools; the Node tools and the showcase page. Every pull request, every push to main and
# weekly, so a query GitHub adds later runs over unchanged code too. This is advanced setup: the repository's
# default setup is "not-configured" (gh api repos/dphhyland/pf-agentic-identity/code-scanning/default-setup,
# 2026-09-27) and stays off - the two would analyse the same code twice and disagree about the build.
#
# Java is built by hand rather than by autobuild: the PF-provided jars come from the image through the same
# composite action Build uses, and `package` with tests skipped is enough for the extractor to see every
# compilation. The jacoco gates are bound to verify, so a package build with tests skipped trips nothing
# (checked 2026-09-27: `mvn -B -DskipTests package` builds the 0.4.0-SNAPSHOT reactor green).
#
# The iOS client's Swift (clients/ios) is not analysed here, for now (U-0130). CodeQL reads Swift only on macOS,
# and the one run of it (pull request #33, run 36309012583, 2026-09-27) took 13 min 35 s on macos-latest - 11 min
# 37 s of it the traced `swift build` of AgentIdentityKit - against about 5 min for Java, and found nothing with
# 27 rules. Running it only when clients/ios changes would leave every other pull request without a category
# main has, which code scanning reports on the pull request as "Code scanning cannot determine the alerts
# introduced by this pull request, because 1 configuration present on refs/heads/main was not found"
# (github/codeql discussion 18506, for /language:swift; GitHub's own documents do not describe the case).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'   # Tuesdays, 04:23 UTC

permissions: {}

# One analysis per ref; a newer push supersedes an in-flight one.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # upload the results to code scanning; nothing else is written
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: the PingFederate version, from build/pf-version.env
        # The one place the version is written down; the composite action reads the same file itself.
        if: matrix.language == 'java-kotlin'
        run: grep -v '^#' build/pf-version.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java-kotlin'
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: extract provided PF jars from the image
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/pf-provided-jars
      - name: build the reactor for the extractor (tests skipped; the gates are bound to verify, and Build runs them)
        if: matrix.language == 'java-kotlin'
        run: mvn -B -DskipTests package
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
