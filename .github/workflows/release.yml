# Publish a versioned, checksummed build of the capability - the build that was verified, not a second one.
#
# WHY THIS EXISTS. Three repos consume this one, and until now every one of them did it by copying
# jars: idp-agentic-demo commits four built artifacts into its tree, pf-oidf-modules stages them from a
# sibling checkout, domain-authority builds them locally. Nothing recorded which build a copy came from,
# so nothing could tell you a copy was stale — and one was, by nearly two weeks and an entire
# split-package unwind, with none of the Tier 1/2 security work in it. That is the failure this closes:
# not tidiness, but the absence of any way to notice.
#
# THE ORDER IS THE POINT. Nothing is published until everything has been checked, and what is
# published is what was checked:
#   1. the tag names the version the poms declare (tools/set-version.py --check), and it is a release,
#      not a snapshot;
#   2. the Build workflow is green on this exact commit (.github/required-checks.txt names the jobs) -
#      a release is not where a test runs for the first time; only a Build a push or a dispatch started
#      counts, one still running is waited for, up to 20 minutes, and one never started fails the release;
#   3. the PF-provided jars come from the image build/pf-version.env pins, by digest, through the same
#      composite action Build uses;
#   4. `mvn -B verify` with tests and coverage gates on, then tools/pf-linkcheck.py against that PF;
#   5. the module set is staged and dist/ assembled (tools/ci/assemble-dist.sh) with a PROVENANCE derived
#      from the staged MANIFEST: the staged module jars and MANIFEST, oidf.war, gm-api.war, the two
#      pf.plugins.* jars, oidf-preflight.jar, and the two build and test tools stage-from-release.sh needs -
#      war-assembler-<version>.jar (the image build runs it; never deployed) and demo-only-ciba-sim.jar (the
#      conformance rig's CIBA simulator, renamed so nothing globbing pf.plugins.* deploys it) - then
#      PROVENANCE.txt and SHA256SUMS over all of it;
#   6. the rebuild deploy will make is made first with `mvn install`, on this runner only, and every jar
#      and war it rebuilt is checked byte for byte against dist/, so a build that is not reproducible
#      stops here, before any draft and before Packages;
#   7. the GitHub release is created as a DRAFT, so a failure after this point leaves nothing public;
#   8. Maven artifacts go to GitHub Packages, and what deploy rebuilt is checked against dist/ again;
#   9. the draft is published;
#  10. publish-public (its own job, after the release job): dist/ is taken from the release-dist artifact and
#      checked against SHA256SUMS and against the internal release's own assets; the public tree is built by
#      tools/export-public.py from the allow-list and scanned by gitleaks; it is committed to
#      ID-Partners/pf-agentic-identity as "Release <version>", tagged, pushed (never with force), and the public
#      release is created from the same dist/ bytes; then every asset is downloaded with no credentials and
#      checked against SHA256SUMS - a failure there puts the public release back to draft.
# Before any of it, public-preflight proves PUBLIC_REPO_TOKEN can push to the public repository, so a real release
# with no usable token stops before the internal draft exists.
# A workflow_dispatch with dry_run stops after 6: everything built, rebuilt and compared, nothing released
# or published.
#
# THE REBUILD IS REAL. deploy runs the lifecycle again, and the compiler recompiles every module whose reactor
# dependency verify has just rebuilt ("Recompiling the module because of changed dependency"), so the jar,
# war, shade and assembly plugins build those archives again. They come out byte-identical only because every
# pom sets project.build.outputTimestamp, the date written on each archive entry, which tools/set-version.py
# sets with the version. Before it did, the v0.5.0 Release (run 36518030296) failed at the comparison: 12 of
# the 14 jars deploy published differed from dist/. Rebuilt the same way locally, rar-model's jar has the same
# entries, sizes and CRCs as the first build's, and different entry dates. The comparison ran only after
# deploy, so those jars were already in Packages when it failed, and the dry run, which stopped before
# it, never ran it at all. Step 6 is the fix for both: it runs in every run, before anything is published.
#
# TWO PUBLICATION CHANNELS, deliberately, because the consumers are not alike:
#   Maven / GitHub Packages   for anything resolving dependencies (domain-authority's phone-simulator
#                             builds against device-enrolment + app-attest). NOTE: GitHub Packages
#                             requires authentication even for PUBLIC reads, so this alone would not
#                             serve the jar-copying consumers.
#   Release assets            the staged module set + wars + plugin jars + SHA256SUMS + PROVENANCE.
#                             Publicly downloadable, no auth, and pinnable by tag and checksum. This is
#                             what a consumer's vendor script should pull.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal the version every pom declares (with docs_only, optional: the version the public docs name)"
        required: false
      dry_run:
        description: "Build, verify and assemble dist/, build the public tree and body, then stop: no draft release, no Packages, nothing published"
        type: boolean
        default: false
      docs_only:
        description: "Publish only the root and docs of this ref (main or a v* tag) to the public repository: no build, no tag, no release"
        type: boolean
        default: false

# Each job holds the permissions it needs; the workflow itself grants none.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false     # never cancel a half-published release

jobs:
  # Before anything is built: can this run publish to the public repository at all? A real release (or a real
  # docs_only run) with no usable PUBLIC_REPO_TOKEN stops here, before the internal draft exists, and says that
  # nothing has been published; a dry run only warns (ready=false) and still builds the public tree and body.
  # The token is in this step's env and in publish-public's steps' env, nowhere else
  # (tools/tests/test_public_token_scope.py holds it there).
  public-preflight:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      author_email: ${{ steps.check.outputs.author_email }}
    steps:
      - name: the public repository exists, the token can push, and the tag is free
        id: check
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ID-Partners/pf-agentic-identity
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          DOCS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.docs_only == true }}
        run: |
          set -euo pipefail
          stop() { echo "::error::$1 Nothing has been published."; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then
            # Docs only ever come from what was merged or released, never from a branch under review.
            case "$GITHUB_REF" in
              refs/heads/main|refs/tags/v*) ;;
              *) stop "docs_only runs from main or a v* tag only, not $GITHUB_REF." ;;
            esac
          else
            VERSION="${RELEASE_TAG#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || stop "'$RELEASE_TAG' is not v<major>.<minor>.<patch>: dispatch with version set, or push a v* tag."
          fi
          if [ -z "$GH_TOKEN" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::PUBLIC_REPO_TOKEN is not set: this dry run builds the public tree and body but cannot check the public repository. A real release would stop here."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            stop "PUBLIC_REPO_TOKEN is not set, so this run cannot publish to $PUBLIC_REPO (CONTRIBUTING.md, Releasing)."
          fi
          gh api "repos/$PUBLIC_REPO" --jq .full_name > /dev/null || stop "$PUBLIC_REPO cannot be read with PUBLIC_REPO_TOKEN: it does not exist, or the token is not granted it."
          # Proof of push without a push: git push --dry-run fetches the receive-pack advertisement, which GitHub
          # refuses without write access (U-0466), and sends nothing. The token reaches git through the
          # environment only, never a remote URL, argv or .git/config.
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          probe="$RUNNER_TEMP/push-probe"
          git init -q "$probe"
          git -C "$probe" -c user.name=probe -c user.email=probe@invalid commit -q --allow-empty -m "never pushed"
          git -C "$probe" push --dry-run --quiet "https://github.com/$PUBLIC_REPO.git" HEAD:refs/heads/preflight-probe-never-pushed \
            || stop "PUBLIC_REPO_TOKEN cannot push to $PUBLIC_REPO (git push --dry-run was refused): it needs Contents read and write."
          rm -rf "$probe"
          # GET .../private-vulnerability-reporting needs Metadata read, which every fine-grained token has (U-0466).
          pvr="$(gh api "repos/$PUBLIC_REPO/private-vulnerability-reporting" --jq .enabled)" || stop "private vulnerability reporting on $PUBLIC_REPO could not be read."
          [ "$pvr" = true ] || stop "private vulnerability reporting is off on $PUBLIC_REPO; SECURITY.md sends reports there. Turn it on in the repository's settings."
          # The commit author publish-public writes: the token owner's GitHub noreply address.
          author="$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')" || stop "GET /user failed with PUBLIC_REPO_TOKEN, so publish-public cannot name its commit author."
          echo "author_email=$author" >> "$GITHUB_OUTPUT"
          if [ "$DOCS_ONLY" != true ]; then
            # v<version> must be absent there, or a commit this workflow made for the same version (a re-run).
            ref="$(gh api "repos/$PUBLIC_REPO/git/matching-refs/tags/v$VERSION" --jq ".[] | select(.ref == \"refs/tags/v$VERSION\") | .object.type + \" \" + .object.sha")" \
              || stop "the tags of $PUBLIC_REPO could not be read."
            if [ -n "$ref" ]; then
              read -r type sha <<< "$ref"
              if [ "$type" = tag ]; then sha="$(gh api "repos/$PUBLIC_REPO/git/tags/$sha" --jq .object.sha)"; fi
              subject="$(gh api "repos/$PUBLIC_REPO/git/commits/$sha" --jq '.message | split("\n")[0]')"
              [ "$subject" = "Release $VERSION" ] || stop "v$VERSION already exists on $PUBLIC_REPO at $sha ('$subject'), which this workflow did not make."
              echo "v$VERSION is already on $PUBLIC_REPO at $sha (a re-run): publish-public checks its tree"
            fi
          fi
          echo "ok: $PUBLIC_REPO exists, PUBLIC_REPO_TOKEN can push to it, private vulnerability reporting is on"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  release:
    needs: public-preflight
    # docs_only builds nothing; publish-public then takes the docs from the dispatch ref.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.docs_only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      packages: write     # publish to GitHub Packages
      actions: read       # the Build runs on the tagged commit, and their jobs
    env:
      # The release tag, as given: the pushed tag, or the dispatch input. VERSION (below) is it without the v.
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # gh and mvn deploy take the token from their own env, never from git
      - name: the PingFederate version, from build/pf-version.env
        # The one place the version is written down; the composite action reads the same file itself.
        run: grep -v '^#' build/pf-version.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        # No Maven cache: a release builds from what Central serves, not from a cache any pull request's build
        # could have written (a restored cache is runtime input, and this workflow publishes what it builds).
        with:
          distribution: temurin
          java-version: '17'
          server-id: github          # matches <distributionManagement><id>github</id>
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      # The tag is the claim; the poms are the fact. Assert rather than rewrite: a release whose
      # coordinates disagree with its tag is worse than a failed one. set-version.py reads every pom
      # the reactor lists - the aggregator, the BOM and its imports, gm-api - so one stale pom fails
      # here rather than publishing a module built against a stale neighbour. It holds every pom's
      # project.build.outputTimestamp to one parsable UTC time as well, and refuses a release that still
      # carries the snapshot's: the rebuild comparison below depends on it.
      - name: the tag must match the declared version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG  version=$VERSION"
          python3 tools/set-version.py --check --no-snapshot --expect "$VERSION" || {
            echo "::error::tag $RELEASE_TAG does not match the poms, or their outputTimestamp is missing, unparsable or a snapshot's (the lines above say which). Bump them with tools/set-version.py, or tag the version that exists."
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_ENV"

      - name: a green Build on this commit
        # The Build workflow's own run on the tagged commit decides: the newest run a push or a dispatch started
        # there (the highest run number - GitHub's run number "increments with each new run") must have
        # concluded success, and so must the latest attempt of each job .github/required-checks.txt names. Those
        # runs test this commit: a push runs on the "Tip commit pushed to the ref", a dispatch on the "Last commit
        # on the GITHUB_REF branch or tag", a re-run of either on "the same GITHUB_SHA", and a push to main or a
        # dispatch needs write access to the repository. A pull request's Build is never read, even when its head
        # is this commit: it tested the merge with its base ("Your CI tests run against the merged result"), and
        # anyone whose pull request workflows run can open one (GitHub's events reference and its re-run and
        # manual-run pages, read 2026-09-27). Before 0.4.0 this step read every check run on the commit, whatever
        # had made it.
        #
        # The step waits, because a tag is pushed on the heels of its commit, and that commit's Build is then still
        # running: v0.3.0's Release (run 36278709651) read `java` in_progress fifteen seconds after the Build on
        # its commit was created, failed, and was re-run by hand once the Build was green (F-0069). While the run
        # has not completed - queued, pending, waiting, requested or in_progress - it is read again every
        # POLL_SECONDS, for up to WAIT_LIMIT_SECONDS. The run is waited on, not its jobs, because a run can sit
        # with no jobs at all: build.yml's concurrency group holds a new push's run "pending" while the previous
        # main Build cancels, and the jobs came 84 s after the run on 8b9e435 and 51 s after it on ab74038
        # (U-0090). The step fails:
        #   - once the run has completed, when it or a required job concluded anything but success (failure,
        #     skipped, timed_out, cancelled - which a pending run is when the next push to main arrives ...);
        #   - when the run passed without a job required-checks.txt names: the tagged commit's own files
        #     disagree, and no re-run can pass;
        #   - when there is no such run after ABSENT_GRACE_SECONDS. A push to main had its run 2 to 3 s after
        #     each of the 17 merges from 2026-09-25 to 2026-09-27, and a commit Build never ran on never gets
        #     one: build.yml runs on a push to main, a pull request or by hand, and a tag push alone starts
        #     nothing ("If you define only tags/tags-ignore or only branches/branches-ignore, the workflow won't
        #     run for events affecting the undefined Git ref" - GitHub's workflow syntax reference, read
        #     2026-09-27). Two minutes absorbs a tag pushed just before its branch and still fails fast;
        #   - when READ_FAILURES_ALLOWED reads in a row are refused: one refusal is tried again at the next read,
        #     and a fault that persists is not waited out for twenty minutes;
        #   - at WAIT_LIMIT_SECONDS.
        # The log says what it is waiting for and how long it has waited. At most 41 reads, each of every page of
        # the commit's Build runs and every page of the chosen run's jobs - one page of each in practice - against
        # GITHUB_TOKEN's "1,000 requests per hour per repository" (GitHub's REST API rate-limit page, read
        # 2026-09-27). A dry run is gated the same way.
        timeout-minutes: 25   # a backstop for a read that never returns; the loop gives up at 20 minutes itself
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          POLL_SECONDS=30            # between reads
          WAIT_LIMIT_SECONDS=1200    # 20 minutes; Build on v0.3.0's commit went from created to green in 3 m 51 s
                                     # (run 36278704385), and the rest is for a run held behind another main
                                     # Build and for runners that are slow to start
          ABSENT_GRACE_SECONDS=120   # for a Build run that is not there yet
          READ_FAILURES_ALLOWED=3    # refused reads in a row
          tab="$(printf '\t')"
          # The commit the version step recorded. The runs query below filters on it, and an empty or malformed
          # value would widen that filter to every Build run on the repository, so it must be a commit id first.
          case "$COMMIT" in
            ''|*[!0-9a-f]*) echo "::error::COMMIT ('$COMMIT') is not a commit id: the version step did not record the tagged commit"; exit 1 ;;
          esac
          [ "${#COMMIT}" -eq 40 ] || { echo "::error::COMMIT ('$COMMIT') is not a 40-character commit id"; exit 1; }
          # One job id per line; comments, blank lines, and stray spaces or carriage returns are not names.
          required="$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//' .github/required-checks.txt | grep -v '^$' || true)"
          [ -n "$required" ] || { echo "::error::.github/required-checks.txt names no job, or is missing"; exit 1; }
          names="$(printf '%s' "$required" | tr '\n' ' ')"
          rerun="re-run this release with gh run rerun $GITHUB_RUN_ID; nothing was published"
          fresh="gh workflow run build.yml --ref $GITHUB_REF_NAME"
          echo "Build must be green on $COMMIT: $names (.github/required-checks.txt)"
          # The newest Build run on the commit that a push or a dispatch started (id, number, attempt, event,
          # status, conclusion), then every attempt of its jobs (name, attempt, status, conclusion). @tsv escapes
          # a tab or a newline inside a value, so each line is one record. Every page of runs is read: pull
          # requests' runs on the same commit come first in the list and could otherwise push the one that counts
          # off the first page. The head_sha is checked here as well as asked of the API.
          read_build() {
            run="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$COMMIT&per_page=100" \
                     --jq '.workflow_runs[] | select(.head_sha == "'"$COMMIT"'" and (.event == "push" or .event == "workflow_dispatch"))
                           | [.id, .run_number, .run_attempt, .event, .status, (.conclusion // "none")] | @tsv')" || return 1
            run="$(printf '%s\n' "$run" | awk 'NF' | sort -t "$tab" -k2,2n | tail -n 1)"
            jobs=''
            [ -n "$run" ] || return 0
            jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/${run%%"$tab"*}/jobs?filter=all&per_page=100" \
                      --jq '.jobs[] | [.name, .run_attempt, .status, (.conclusion // "none")] | @tsv')" || return 1
          }
          started=$SECONDS
          failures=0
          shown='(nothing read yet)'
          state='nothing read yet'
          while :; do
            waited=$((SECONDS - started))
            if read_build; then
              failures=0
              if [ "$run$tab$jobs" != "$shown" ]; then
                if [ -z "$run" ]; then
                  echo "no Build run on $COMMIT from a push or by hand at ${waited}s"
                else
                  echo "Build run on $COMMIT at ${waited}s (id, number, attempt, event, status, conclusion): $(printf '%s' "$run" | tr '\t' ' ')"
                  if [ -n "$jobs" ]; then printf '%s\n' "$jobs" | tr '\t' ' ' | sed 's/^/  job (name, attempt, status, conclusion): /'; else echo "  no jobs yet"; fi
                fi
                shown="$run$tab$jobs"
              fi
              if [ -z "$run" ]; then
                if [ "$waited" -ge "$ABSENT_GRACE_SECONDS" ]; then
                  echo "::error::no Build run on $COMMIT after ${waited}s: Build never started there from a push to main or by hand (a pull request's Build does not count, and a tag push alone starts none). Start one with $fresh, then $rerun."
                  exit 1
                fi
                state='no Build run yet'
              else
                IFS="$tab" read -r run_id _ attempt event status conclusion <<< "$run"
                absent=''; failed=''; progress=''; unfinished=''
                while IFS= read -r name; do
                  # The job's records, matched as strings: awk's -v would expand a backslash in the name, and ==
                  # compares as numbers when both sides look numeric. Then its latest attempt - GitHub's
                  # run_attempt "increments with each re-run" - where every record must have passed, so two jobs
                  # that share a name cannot hide a failure behind a success.
                  recs="$(printf '%s\n' "$jobs" | NAME="$name" awk -F'\t' 'NF && ($1 "") == (ENVIRON["NAME"] "")')"
                  if [ -z "$recs" ]; then
                    absent="${absent:+$absent, }$name"
                    progress="${progress:+$progress, }$name not started"
                    continue
                  fi
                  top="$(printf '%s\n' "$recs" | awk -F'\t' '{ if ($2 + 0 > m) m = $2 + 0 } END { print m + 0 }')"
                  verdict="$(printf '%s\n' "$recs" | awk -F'\t' -v a="$top" '
                    ($2 + 0) != (a + 0) { next }
                    $3 != "completed"   { pending = pending (pending ? "/" : "") $3; next }
                    $4 != "success"     { bad = bad (bad ? "/" : "") $4 }
                    END { if (pending) print "unfinished\t" pending; else if (bad) print "failed\t" bad; else print "success\tsuccess" }')"
                  IFS="$tab" read -r kind detail <<< "$verdict"
                  progress="${progress:+$progress, }$name $detail"
                  case "$kind" in
                    unfinished) unfinished="${unfinished:+$unfinished, }$name $detail" ;;
                    failed)     failed="${failed:+$failed, }$name $detail" ;;
                  esac
                done <<< "$required"
                # A run that reads completed while a required job's latest attempt does not is being re-run
                # between the two reads: wait for the re-run rather than judge the attempt before it.
                if [ "$status" = completed ] && [ -z "$unfinished" ]; then
                  if [ "$conclusion" = success ] && [ -z "$failed$absent" ]; then
                    echo "ok: Build run $run_id ($event, attempt $attempt) on $COMMIT concluded success, and so did each of $names; waited ${waited}s"
                    exit 0
                  fi
                  if [ "$conclusion" = success ] && [ -z "$failed" ]; then
                    # The tagged commit's own files disagree, so no re-run of this release can pass.
                    echo "::error::Build run $run_id passed on $COMMIT without $absent: this commit's .github/required-checks.txt names a job its build.yml does not have. Correct the file in a new commit and release from that."
                    exit 1
                  fi
                  echo "::error::Build run $run_id ($event, attempt $attempt) on $COMMIT is not green - the run concluded $conclusion; $progress. Start a fresh Build there with $fresh and, once it is green, $rerun."
                  exit 1
                fi
                state="Build run $run_id ($event, attempt $attempt) $status: $progress"
              fi
            else
              failures=$((failures + 1))
              if [ "$failures" -ge "$READ_FAILURES_ALLOWED" ]; then
                echo "::error::the Build runs on $COMMIT could not be read $failures times in a row (gh's messages are above). Once the API answers, $rerun."
                exit 1
              fi
              echo "could not read the Build runs on $COMMIT at ${waited}s (refusal $failures in a row; refusal $READ_FAILURES_ALLOWED ends the step); trying again"
            fi
            if [ "$waited" -ge "$WAIT_LIMIT_SECONDS" ]; then
              echo "::error::gave up after ${waited}s: Build on $COMMIT is not green ($state). Once it is, $rerun."
              exit 1
            fi
            echo "waiting for Build on $COMMIT - $state; ${waited}s of ${WAIT_LIMIT_SECONDS}s, next read in ${POLL_SECONDS}s"
            sleep "$POLL_SECONDS"
          done

      - name: no archive or key material may be released
        # The same invariant build.yml enforces, at the one moment artifacts leave the repo.
        run: |
          tracked="$(git ls-files '*.zip' '*pf.jwk' '*pingfederate-system-keys.xml' '*.jwk' '*.jks' '*.p12' '*.pfx' '*.lic')"
          [ -n "$tracked" ] && { echo "::error::refusing to release with key material tracked:"; printf '%s\n' "$tracked"; exit 1; }
          echo "clean"

      - name: extract the provided PF jars from the image
        uses: ./.github/actions/pf-provided-jars

      # Tests ON, coverage gates ON (they are bound to verify, not package). A release is the one build
      # where "it compiled" is not the bar.
      - name: build the reactor with tests
        # The commit goes into platform-pf's manifest, where /agentic-identity/info and the start-up banner read it
        # (F-0190). install and deploy below pass the same, so their rebuilds make the bytes verify built.
        run: mvn -B verify -Doidf.build.commit="$GITHUB_SHA"

      - name: every PingFederate and servlet member the artifacts link resolves on this image
        run: python3 tools/pf-linkcheck.py --lib pf-lib --lib pf-jetty-lib --reactor .

      - name: stage the module set
        # Writes modules/ + MANIFEST. assemble-pf-runtime-war.sh refuses a directory that does not match
        # its MANIFEST, so a partial stage fails the release rather than shipping a war that 500s.
        # The production profile: the CIBA simulator is a rig-only plugin and never ships in a release.
        run: bash build/pingfederate/stage-modules.sh --profile production

      - name: assemble the release artifacts
        # Every copy is unconditional (tools/ci/assemble-dist.sh): a missing war or plugin jar fails the release
        # instead of quietly shipping without it, which is how a consumer would first learn of it. The same
        # script makes the dist Build's image job stages a release from, so what it proves is what ships here.
        run: |
          MANIFEST=build/pingfederate/modules/MANIFEST
          tools/ci/assemble-dist.sh dist "$VERSION"
          # MANIFEST/2 carries a header and [section] lines; only the "<sha256>  <file>" lines are jars.
          MODULES=$(grep -cE '^[0-9a-f]{64}  ' "$MANIFEST")
          echo "MODULES=$MODULES" >> "$GITHUB_ENV"

          # Provenance: what a consumer needs to answer "which build is this, and am I behind?" The
          # module count and list come from the MANIFEST the stage step wrote, not from prose.
          {
            echo "pf-agentic-identity $VERSION"
            echo "commit:       $COMMIT"
            echo "tag:          $RELEASE_TAG"
            echo "built:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:          $GITHUB_RUN_ID (Release workflow of the private source repository)"
            echo "pingfederate: $PF_VERSION, built and link-checked against ${PF_IMAGE}@${PF_IMAGE_DIGEST}"
            echo
            echo "PingFederate line: 13.1.x (jakarta.servlet), from 0.2.0. These artifacts do NOT load on"
            echo "13.0.x - the last javax.servlet release is v0.1.5. A servlet or filter built for the other"
            echo "line fails the war with a 503, or is silently never mapped; the assemble script refuses"
            echo "the mismatch before it can boot. Which line a build targets is the thing a consumer most"
            echo "needs. See docs/pf-13_1-jakarta-migration-plan.md."
            echo
            echo "The module set below is what PF loads: $MODULES SEPARATE JARS staged into modules/ and"
            echo "merged into pf-runtime.war at image build (build/pingfederate/assemble-pf-runtime-war.sh)."
            echo "It is NOT the legacy single pf-oidf-modules.jar, which this build has not produced since"
            echo "the 2026-08-15 split-package unwind - if you are copying a file by that name, you are"
            echo "running code older than that unwind."
            echo
            echo "modules ($MODULES, from MANIFEST):"
            sed 's/^/  /' "$MANIFEST"
            echo
            echo "also in this release: oidf.war (the modules as a standalone war, for a demo),"
            echo "pf.plugins.pf-rar-paz-plugin.jar, pf.plugins.instance-registry-datasource.jar, gm-api.war, and"
            echo "oidf-preflight.jar: run java -jar oidf-preflight.jar --env-file FILE on the env file before upgrading."
            echo
            echo "Two build and test tools, neither of them a deployable: war-assembler-$VERSION.jar, the war"
            echo "assembler the image build runs (build/pingfederate/stage-from-release.sh stages it beside"
            echo "modules/); and demo-only-ciba-sim.jar, the conformance rig's CIBA simulator, which only the"
            echo "conformance profile stages. The simulator refuses every request outside"
            echo "OIDF_DEPLOYMENT_PROFILE=development and must never be put in a production deploy directory."
          } > dist/PROVENANCE.txt

          ( cd dist && sha256sum -- * > SHA256SUMS )
          # Where each dist file came from in the reactor (the target/ file deploy will publish, not the
          # staged copy), so the comparisons after the install and after the deploy can prove the rebuilds
          # made the same bytes. A basename can name two reactor files: oidf.jar is servlets/pf-integration's
          # module (what stage-modules.sh stages) AND servlets/oidf-war's jar-packaged aggregate, which is
          # never staged or deployed. So the aggregate is excluded, any other collision is an error rather
          # than a first hit, and the resolved source is compared with the dist file HERE - a wrong
          # resolution fails this step, not the byte comparisons after it.
          # demo-only-ciba-sim.jar is the one dist file under a name of its own, so it is mapped by name; any
          # other name that resolves to nothing or to two files still fails.
          ( for f in dist/*.jar dist/*.war; do
              b="$(basename "$f")"
              if [ "$b" = demo-only-ciba-sim.jar ]; then
                src=plugins/ciba-sim/target/pf.plugins.ciba-sim.jar
              else
                src="$(find libs servlets plugins services tools build -path "*/target/$b" -not -path "*/oidf-war/target/*.jar")"
              fi
              case "$(printf '%s\n' "$src" | grep -c .)" in
                1) ;;
                0) echo "::error::no reactor source for $b"; exit 1 ;;
                *) echo "::error::$b resolves to more than one reactor file: $(printf '%s' "$src" | tr '\n' ' ')"; exit 1 ;;
              esac
              cmp -s "$src" "$f" || { echo "::error::$src is not the file staged as $b"; exit 1; }
              sha256sum "$f" | sed "s|  dist/.*|  $src|"
            done ) > dist-sources.sha256
          cat dist-sources.sha256
          echo "--- release contents"; ls -la dist
          echo "--- PROVENANCE"; cat dist/PROVENANCE.txt

      - name: the rebuild deploy will make, installed on this runner first
        # deploy is install plus the upload, so install runs the lifecycle deploy runs, recompiles what deploy
        # recompiles and rebuilds the archives deploy rebuilds (the header's "THE REBUILD IS REAL"). It
        # writes only target/ and this runner's ~/.m2, so the comparison below can stop the release before
        # a draft or a package exists. Tests already ran in verify; running them again here would double a
        # slow build for no new signal.
        run: mvn -B -DskipTests -Doidf.build.commit="$GITHUB_SHA" install

      - name: the rebuilt jars and wars are what dist/ holds
        # Every jar and war in dist/ against the reactor file the install above left in target/, byte for
        # byte. Runs in both modes, and before anything is published. dist-sources.sha256 has one line per
        # dist jar and war (the assemble step writes it, and fails when it cannot). The wars are held to it
        # too: the same lifecycle rebuilds oidf.war and gm-api.war (which is never deployed), so a war that
        # differed would mean the release's war is not the one this commit builds. Before 0.6.0 they were
        # only reported, because without an outputTimestamp a rebuilt war differed.
        run: |
          [ -s dist-sources.sha256 ] || { echo "::error::dist-sources.sha256 is missing or empty"; exit 1; }
          sha256sum -c --strict dist-sources.sha256 || {
            echo "::error::the rebuild made different bytes from dist/ (the FAILED lines above). The poms' outputTimestamp passed the tag check, so something else in the build is not reproducible: compare a FAILED file with its dist/ copy (zipinfo -T, unzip -v). Nothing has been published."
            exit 1
          }

      - name: dist/ as the artifact release-dist, for publish-public
        # Both modes. publish-public takes the release's bytes from here (and, in a real run, holds them to the
        # internal release's assets), so the public release is the build this job verified.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: dry run stops here
        if: env.DRY_RUN == 'true'
        run: |
          echo "dry run: built, verified, assembled dist/ and rebuilt it byte for byte for $VERSION; nothing released, nothing published"

      - name: the draft GitHub release
        # A draft: nothing is public until the last step, so a failure in between leaves no half-release.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          The PF module set, wars and plugin jars for this version, with `SHA256SUMS` and
          `PROVENANCE.txt` recording the commit and the PingFederate image that produced them.

          **Where to download.** These same assets, byte for byte, are published without authentication at
          `https://github.com/ID-Partners/pf-agentic-identity/releases/tag/__TAG__`, with the release's
          page at that tag. That public release is what a consumer's vendor script should pull.

          **Consuming this.** Pull the assets and check them with `sha256sum -c SHA256SUMS`; record the
          commit and tag `PROVENANCE.txt` names. Do not copy jars from a sibling checkout without recording
          which build they came from - that is how a consumer ended up running module code from before the
          split-package unwind, with none of the security work in it, and no way to notice.

          `modules/` is **__MODULES__ separate jars** (listed in `MANIFEST`), not the legacy single
          `pf-oidf-modules.jar`. Anything still copying a file by that name is running pre-2026-08-15 code.

          Built and link-checked against `__PF_IMAGE__`. `demo-only-ciba-sim.jar` is the conformance rig's
          CIBA simulator: it refuses every request outside `OIDF_DEPLOYMENT_PROFILE=development` and never
          goes in a production deploy directory.

          Maven artifacts are also published to GitHub Packages under `com.pingidentity.ps.oidf`, for
          internal consumers with access to this private repository: GitHub Packages requires
          authentication even to read.
          NOTES
          sed -i "s|__MODULES__|$MODULES|; s|__PF_IMAGE__|${PF_IMAGE}@${PF_IMAGE_DIGEST}|; s|__TAG__|$RELEASE_TAG|" release-notes.md
          gh release create "$RELEASE_TAG" dist/* --draft \
            --title "pf-agentic-identity $VERSION" \
            --notes-file release-notes.md

      - name: publish Maven artifacts to GitHub Packages
        if: env.DRY_RUN != 'true'
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # deploy rebuilds once more: the install above rebuilt every reactor dependency again, so the compiler
        # recompiles the modules that have one and their archives are built again. The outputTimestamp keeps them the
        # bytes the comparison above accepted, and the step after this checks it for the files deploy sent. It passes
        # the commit as verify and install did, or platform-pf's manifest would differ (F-0190).
        run: mvn -B -DskipTests -Doidf.build.commit="$GITHUB_SHA" deploy

      - name: what deploy published is still what dist/ holds
        # The same check as before the deploy, on the files deploy just rebuilt and published. The install
        # comparison above makes a failure here unlikely; if it happens anyway, Packages holds the files and
        # the draft stays a draft.
        if: env.DRY_RUN != 'true'
        run: |
          [ -s dist-sources.sha256 ] || { echo "::error::dist-sources.sha256 is missing or empty"; exit 1; }
          sha256sum -c --strict dist-sources.sha256 || {
            echo "::error::the rebuild made different bytes from dist/ (the FAILED lines above). The poms' outputTimestamp passed the tag check, so something else in the build is not reproducible: compare a FAILED file with its dist/ copy (zipinfo -T, unzip -v). Packages already holds these files; the draft stays a draft."
            exit 1
          }

      - name: publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  # The public repository gets the release this run verified: the same dist/ bytes, the public tree
  # tools/export-public.py builds from the allow-list, and a release whose body summarises the release page.
  # It runs after the release job in both modes - a dry run uploads the tree and the body as artifacts and
  # pushes nothing - and on a docs_only dispatch, where the release job is skipped, it publishes only the root
  # and docs of the dispatch ref (main or a v* tag). PUBLIC_REPO_TOKEN is in the env of the steps that talk to
  # the public repository and nowhere else; git gets it through the environment (GIT_CONFIG_* and the
  # extraheader), never a remote URL or .git/config. Nothing here is ever force-pushed, and a hand-made commit
  # on the public main is a stop, not an overwrite.
  publish-public:
    needs: [public-preflight, release]
    # After a successful release job (real or dry run), or after the release job was skipped for docs_only.
    # A failed or cancelled release job never reaches here.
    if: >-
      ${{ !cancelled() && needs.public-preflight.result == 'success'
          && (needs.release.result == 'success'
              || (needs.release.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.docs_only)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read      # the internal release's assets, held against the artifact
      actions: read       # the release-dist artifact of this run
    timeout-minutes: 30
    env:
      PUBLIC_REPO: ID-Partners/pf-agentic-identity
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      DOCS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.docs_only == true }}
      READY: ${{ needs.public-preflight.outputs.ready }}
      AUTHOR_EMAIL: ${{ needs.public-preflight.outputs.author_email }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: where the tree, the clone and the body go
        # Under the runner's temp directory, outside the checkout (the runner context is not available to a
        # job's env, so the paths are set here).
        run: |
          {
            echo "PUBLIC_TREE=$RUNNER_TEMP/public"
            echo "PUBLIC_CLONE=$RUNNER_TEMP/public-clone"
            echo "BODY=$RUNNER_TEMP/public-release-body.md"
          } >> "$GITHUB_ENV"

      - name: the version this run publishes
        # A release: the tag's version. docs_only: the latest release already on the public repository, which is
        # the version the public README names; the docs come from the dispatch ref regardless.
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$DOCS_ONLY" = true ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/tags/v*) ;;
              *) echo "::error::docs_only runs from main or a v* tag only, not $GITHUB_REF"; exit 1 ;;
            esac
            if [ "$READY" != true ]; then
              echo "::warning::no PUBLIC_REPO_TOKEN: the docs_only dry run exports with the version of the dispatch ref"
              VERSION="$(sed -n 's/.*<version>\([0-9][^<]*\)<\/version>.*/\1/p' bom/pom.xml | head -n 1)"
            else
              VERSION="$(gh release view --repo "$PUBLIC_REPO" --json tagName --jq '.tagName | ltrimstr("v")')" \
                || { echo "::error::$PUBLIC_REPO has no release to name in the docs"; exit 1; }
            fi
          else
            VERSION="${RELEASE_TAG#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$RELEASE_TAG' is not v<major>.<minor>.<patch>"; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version $VERSION (docs_only=$DOCS_ONLY, dry_run=$DRY_RUN, ready=$READY)"

      - name: the pinned gitleaks
        run: tools/ci/install-lint-tools.sh "$RUNNER_TEMP/lint-tools" gitleaks

      - name: dist/ from this run, held to its SHA256SUMS
        if: env.DOCS_ONLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name release-dist --dir dist
          ( cd dist && sha256sum -c --strict SHA256SUMS )
          echo "--- dist"; ls -la dist

      - name: the internal release's assets are these bytes
        # A real run only: the draft the release job published is downloaded and every file compared with the
        # artifact, so what the public release carries is what the internal one does, byte for byte.
        if: env.DOCS_ONLY != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir internal-release
          for f in dist/*; do
            b="$(basename "$f")"
            [ -f "internal-release/$b" ] || { echo "::error::the internal release $RELEASE_TAG has no asset $b"; exit 1; }
            cmp -s "$f" "internal-release/$b" || { echo "::error::$b differs between dist/ and the internal release"; exit 1; }
          done
          extra="$(comm -13 <(ls dist | sort) <(ls internal-release | sort))"
          [ -z "$extra" ] || { echo "::error::the internal release carries assets dist/ does not: $extra"; exit 1; }
          echo "every asset of $RELEASE_TAG is byte for byte the artifact's"

      - name: the public tree
        # Only tracked files reach the export (git's index), so nothing git-ignored can. gitleaks then reads the
        # tree it wrote, redacted, so a secret that got past the manifest stops here and is not printed.
        run: |
          set -euo pipefail
          if [ "$DOCS_ONLY" = true ]; then
            python3 tools/export-public.py --docs-only --version "$VERSION" "$PUBLIC_TREE"
          else
            python3 tools/export-public.py --version "$VERSION" "$PUBLIC_TREE"
          fi
          "$RUNNER_TEMP/lint-tools/gitleaks" dir "$PUBLIC_TREE" --redact --no-banner
          echo "--- public tree"; ( cd "$PUBLIC_TREE" && find . -type f | sort )

      - name: the release body
        if: env.DOCS_ONLY != 'true'
        run: |
          set -euo pipefail
          python3 tools/public-release-body.py "$VERSION" --tree "$PUBLIC_TREE" --sums dist/SHA256SUMS -o "$BODY"
          echo "--- body ($(wc -c < "$BODY") bytes)"; cat "$BODY"

      - name: dry run - the tree and the body, as artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-tree
          path: ${{ runner.temp }}/public
          if-no-files-found: error
          retention-days: 7
      - name: dry run - the body
        if: env.DRY_RUN == 'true' && env.DOCS_ONLY != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-body
          path: ${{ runner.temp }}/public-release-body.md
          if-no-files-found: error
          retention-days: 7
      - name: dry run stops here
        if: env.DRY_RUN == 'true'
        run: |
          echo "dry run: the public tree and body are artifacts of this run; nothing was pushed to $PUBLIC_REPO"

      - name: the public repository's main, as it is
        # The clone is refused unless its history is empty or every commit on main is one this workflow or the
        # mirror made. A commit made by hand there is a stop: nothing is overwritten.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [ "$READY" = true ] || { echo "::error::public-preflight did not report the token ready; nothing is published"; exit 1; }
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          git clone --quiet --branch main --single-branch "https://github.com/$PUBLIC_REPO.git" "$PUBLIC_CLONE" 2>/dev/null \
            || git clone --quiet "https://github.com/$PUBLIC_REPO.git" "$PUBLIC_CLONE"
          cd "$PUBLIC_CLONE"
          if git rev-parse --verify -q HEAD > /dev/null; then
            git fetch --quiet --tags origin
            bad="$(git log --format='%h %s' main | grep -vE '^[0-9a-f]+ (Release [0-9]+\.[0-9]+\.[0-9]+( \(mirrored\))?|Docs \S+ [0-9]{4}-[0-9]{2}-[0-9]{2})$' || true)"
            [ -z "$bad" ] || { echo "::error::$PUBLIC_REPO main carries a commit this workflow did not make; nothing is overwritten:"; echo "$bad"; exit 1; }
            echo "main is at $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
          else
            git checkout --quiet -b main
            echo "the public repository is empty: this commit is its root"
          fi

      - name: the commit, the tag and the push
        # Full export: everything but .git is replaced by the tree. docs_only: image/ and demo/ are kept as they
        # are and the root and docs are replaced. An identical tree makes no commit (a re-run); a v<version> tag
        # already at this tree is kept, one at another tree is a stop. Pushes are plain pushes, never forced.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$b64"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64"
          cd "$PUBLIC_CLONE"
          if [ "$DOCS_ONLY" = true ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name image ! -name demo -exec rm -rf {} +
            message="Docs $GITHUB_REF_NAME $(date -u +%Y-%m-%d)"
          else
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            message="Release $VERSION"
          fi
          cp -R "$PUBLIC_TREE"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "the tree is already what main holds: no commit"
          else
            git -c user.name="pf-agentic-identity release" -c user.email="$AUTHOR_EMAIL" commit --quiet -m "$message"
            echo "committed $(git rev-parse --short HEAD): $message"
          fi
          if [ "$DOCS_ONLY" != true ]; then
            if git rev-parse --verify -q "refs/tags/v$VERSION" > /dev/null; then
              [ "$(git rev-parse "v$VERSION^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ] \
                || { echo "::error::v$VERSION already exists on $PUBLIC_REPO at another tree; nothing is moved"; exit 1; }
              echo "v$VERSION already tags this tree"
            else
              git -c user.name="pf-agentic-identity release" -c user.email="$AUTHOR_EMAIL" tag -a "v$VERSION" -m "pf-agentic-identity $VERSION"
            fi
            git push --quiet origin main "refs/tags/v$VERSION"
            echo "pushed main and v$VERSION to $PUBLIC_REPO"
          else
            git push --quiet origin main
            echo "pushed main to $PUBLIC_REPO"
          fi

      - name: the public release
        # Created as a draft with every dist file, then published and marked latest. An existing published
        # release (a re-run) is left as it is and only checked below.
        if: env.DRY_RUN != 'true' && env.DOCS_ONLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if state="$(gh release view "v$VERSION" --repo "$PUBLIC_REPO" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = false ]; then echo "v$VERSION is already published on $PUBLIC_REPO: checked below"; exit 0; fi
            echo "v$VERSION is a draft on $PUBLIC_REPO from an earlier attempt: replaced"
            gh release delete "v$VERSION" --repo "$PUBLIC_REPO" --yes
          fi
          gh release create "v$VERSION" dist/* --repo "$PUBLIC_REPO" --verify-tag --draft \
            --title "pf-agentic-identity $VERSION" --notes-file "$BODY"
          gh release edit "v$VERSION" --repo "$PUBLIC_REPO" --draft=false --latest
          echo "published https://github.com/$PUBLIC_REPO/releases/tag/v$VERSION"

      - name: every public asset, downloaded with no credentials, is what SHA256SUMS says
        # No token in this step: the check is the consumer's. The CDN can lag the publish by a little, so the
        # loop retries for up to five minutes.
        id: anonymous
        if: env.DRY_RUN != 'true' && env.DOCS_ONLY != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/$PUBLIC_REPO/releases/download/v$VERSION"
          mkdir -p anon && cd anon
          deadline=$((SECONDS + 300))
          until curl -fsSL -o SHA256SUMS "$base/SHA256SUMS" && cmp -s SHA256SUMS ../dist/SHA256SUMS; do
            [ $SECONDS -lt $deadline ] || { echo "::error::$base/SHA256SUMS is not the release's after five minutes"; exit 1; }
            sleep 15
          done
          while read -r _ name; do
            [ "$name" = SHA256SUMS ] && continue
            until curl -fsSL -o "$name" "$base/$name"; do
              [ $SECONDS -lt $deadline ] || { echo "::error::$base/$name could not be downloaded after five minutes"; exit 1; }
              sleep 15
            done
          done < SHA256SUMS
          sha256sum -c --strict SHA256SUMS
          echo "every asset of v$VERSION on $PUBLIC_REPO verifies anonymously"

      - name: a failed check puts the public release back to draft
        if: failure() && steps.anonymous.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release edit "v$VERSION" --repo "$PUBLIC_REPO" --draft=true
          echo "::error::v$VERSION on $PUBLIC_REPO is a draft again: its assets did not verify anonymously; re-run this job once they do"
