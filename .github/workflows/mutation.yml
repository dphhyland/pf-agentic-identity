# Mutation testing of the federation modules' decision classes - the `mutation` profile in each module's pom.
# pitest changes a class one small way at a time and runs the tests that reach it; a change no test notices is
# a check the tests only appear to make. Weekly and by hand, never on a push: it runs tests once per mutant.
# Each module fails below 85% killed; the reports are kept either way.
name: Mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 0'   # Sundays, 02:41 UTC

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    # The runner is the repository variable RUNNER_LINUX's label (docs/development/ci-runners.md), or a hosted
    # ubuntu-latest when the variable is unset - as it is until the self-hosted runners exist - and always for a
    # pull request Dependabot opened, whose build runs the dependency's code and so never runs on the Mac.
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'ubuntu-latest' || vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the PingFederate version, from build/pf-version.env
        # The one place the version is written down; the composite action reads the same file itself.
        run: grep -v '^#' build/pf-version.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: extract provided PF jars from the image
        uses: ./.github/actions/pf-provided-jars
      - name: build the modules the two depend on
        run: mvn -q -DskipTests install -pl servlets/pf-integration -am
      - name: libs/openid-federation
        run: mvn -Pmutation verify -pl libs/openid-federation -Djacoco.skip=true
      - name: servlets/pf-integration
        if: success() || failure()
        run: mvn -Pmutation verify -pl servlets/pf-integration -Djacoco.skip=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: pit-reports
          path: |
            libs/openid-federation/target/pit-reports
            servlets/pf-integration/target/pit-reports
