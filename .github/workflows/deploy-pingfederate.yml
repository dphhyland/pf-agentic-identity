# Build-in-CI + deploy for pingfederate-runtime (the AS). The module source lives IN THIS REPO
# (modules/*) — no external checkout or deploy key needed. The licensed pf-protocolengine jar,
# the pf SDK jar, and the stock pf-runtime.war are EXTRACTED from the pingidentity/pingfederate
# image the deploy already builds FROM (public pull; running needs a license, extracting doesn't).
# Licensing note: the runtime image is DevOps-licensed at boot (PING_IDENTITY_DEVOPS_* service
# vars) — nothing licensed is baked here.
#
# Still to provision before first run (repo → Settings → Secrets and variables → Actions):
#   PF_JWK                 the PF master key (pf.jwk) contents
#   PF_SYSTEM_KEYS         pingfederate-system-keys.xml contents
#   RAILWAY_TOKEN_STAGING / RAILWAY_TOKEN_PROD
# The per-env config archive is NOT committed and must never be: a PF configArchive is a plain zip
# that contains pf.jwk itself, so "encrypted with pf.jwk → safe to commit" (what this comment used to
# say) is false — an export always ships the key that would decrypt it, plus the admin password hash
# and reversible client secrets. deploy/pingfederate/data.staging.zip was committed on that false
# premise; its key is treated as compromised. The replacement mechanism (an age-encrypted archive
# decrypted at boot) lands with the key rotation — until then this workflow refuses to deploy.
# Two image paths marked CONFIRM below on first run.
name: Deploy PingFederate (build-in-CI)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or production
        required: true
        default: staging

env:
  PF_IMAGE: pingidentity/pingfederate:13.0.3-alpine_3.23.4-al21-latest
  JOSE4J: org.bitbucket.b_c:jose4j:0.9.6

permissions:
  contents: read

# Never let two deploys of the same service+environment race: `railway up` is last-write-wins, and
# two in-flight uploads can land in either order, so the service can end up running the older one.
# Not cancel-in-progress - a half-finished deploy is worse than a queued one.
concurrency:
  group: deploy-pingfederate-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A real GitHub Environment (scoped secrets + protection rules), resolved from the dispatch input.
    # Previously `environment:` here named only the input, which gated nothing.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }

      - name: extract licensed artifacts from the PF image (provided jars + stock war)
        run: |
          docker create --name pf "$PF_IMAGE"
          # CONFIRM paths inside the image on first run (PF server lib + deployed runtime war):
          docker cp pf:/opt/out/instance/server/default/lib/. pf-lib/ 2>/dev/null || \
            docker cp pf:/opt/server/server/default/lib/. pf-lib/
          docker cp pf:/opt/out/instance/server/default/deploy/pf-runtime.war stock-pf-runtime.war 2>/dev/null || \
            docker cp pf:/opt/server/server/default/deploy/pf-runtime.war stock-pf-runtime.war
          docker rm pf
          PF_PE=$(ls pf-lib/pf-protocolengine*.jar | head -1)
          mvn -q install:install-file -Dfile="$PF_PE" -DgroupId=pingfederate \
            -DartifactId=pf-protocolengine -Dversion=13.0.0.3 -Dpackaging=jar -DgeneratePom=true
          docker create --name pfsdk "$PF_IMAGE" && { docker cp pfsdk:/opt/out/instance/sdk/lib/. pf-sdk-lib/ 2>/dev/null || docker cp pfsdk:/opt/server/sdk/lib/. pf-sdk-lib/ || true; }; docker rm pfsdk
          PF_SDK=""; for j in pf-sdk-lib/*.jar pf-lib/*.jar; do unzip -l "$j" 2>/dev/null | grep -q "com/pingidentity/access/JwksEndpointKeyAccessor.class" && PF_SDK="$j" && break; done
          echo "SDK jar picked by content: $PF_SDK"; test -n "$PF_SDK"
          mvn -q install:install-file -Dfile="$PF_SDK" -DgroupId=com.pingidentity.pingfederate \
            -DartifactId=pingfederate-sdk -Dversion=13.0.0.3 -Dpackaging=jar -DgeneratePom=true
          # gm-api's provided deps use the local.pingfederate convention — same jars, from the image lib
          mvn -q install:install-file -Dfile="$PF_SDK" -DgroupId=local.pingfederate -DartifactId=pingfederate-sdk -Dversion=13.0.3 -Dpackaging=jar -DgeneratePom=true
          mvn -q dependency:get -Dartifact=org.eclipse.jetty.toolchain:jetty-servlet-api:4.0.9
          SAPI=$(find ~/.m2 -name 'jetty-servlet-api-4.0.9.jar' | head -1)
          mvn -q install:install-file -Dfile="$SAPI" -DgroupId=local.pingfederate -DartifactId=servlet-api -Dversion=4.0.9 -Dpackaging=jar -DgeneratePom=true
          for spec in jose4j:1.x jackson-databind:2.x jackson-core:2.x jackson-annotations:2.x commons-lang3:3.x commons-logging:1.x; do
            a="${spec%%:*}"; v="${spec##*:}"
            J=$(ls pf-lib/${a}-[0-9]*.jar 2>/dev/null | head -1); [ -z "$J" ] && J=$(ls pf-lib/*${a}*.jar 2>/dev/null | head -1)
            echo "local.pingfederate:$a:$v <- $J"; test -n "$J"
            mvn -q install:install-file -Dfile="$J" -DgroupId=local.pingfederate -DartifactId="$a" -Dversion="$v" -Dpackaging=jar -DgeneratePom=true
          done

      - name: build the platform (reactor → oidf.jar/oidf.war + plugin jars)
        run: mvn -q -DskipTests package

      - name: stage module jars for the Docker build
        # The Dockerfile assembles pf-runtime.war itself (stock war from the base image + these
        # modular jars merged into WEB-INF/lib + the engine deploy dir) — no CI-side war assembly.
        run: bash deploy/pingfederate/build/stage-modules.sh

      - name: materialise secrets + per-env config (never committed)
        working-directory: deploy/pingfederate
        run: |
          # Gate FIRST: no config archive is available (it is deliberately absent from git — see the
          # header), so fail before any key material is written to the runner's disk. Never fall back
          # to a committed archive.
          echo "::error::No config archive available for ${{ inputs.environment }}."
          echo "A PF configArchive contains pf.jwk and must not be committed; the previously" >&2
          echo "committed data.staging.zip is treated as compromised. Deploys resume once the" >&2
          echo "master key is rotated and the age-encrypted archive mechanism is in place." >&2
          exit 1
          # Restored with that mechanism:
          #   mkdir -p overlay
          #   printf '%s' "${{ secrets.PF_JWK }}"         > overlay/pf.jwk
          #   printf '%s' "${{ secrets.PF_SYSTEM_KEYS }}" > overlay/pingfederate-system-keys.xml

      - name: railway up → pingfederate-runtime
        working-directory: deploy/pingfederate
        env:
          RAILWAY_TOKEN: ${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PROD || secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          npm i -g @railway/cli@5.41.2
          # --no-gitignore: the staged build artifacts (modules/, data.zip, overlay/ secrets) are
          # gitignored on purpose; without this flag `railway up` silently drops them from the
          # upload and the Docker build fails on its COPYs. .railwayignore governs exclusions.
          railway up --ci --no-gitignore --service pingfederate-runtime
