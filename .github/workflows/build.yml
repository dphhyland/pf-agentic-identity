# CI build: the whole platform, on every push/PR. The two provided PF jars (pf-protocolengine +
# pingfederate-sdk) are extracted from the public pingidentity/pingfederate image — running PF needs
# a license, extracting jars does not — so the reactor builds with no private dependencies at all.
name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  PF_IMAGE: pingidentity/pingfederate:13.0.3-alpine_3.23.4-al21-latest

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: extract provided PF jars from the image
        run: |
          docker create --name pf "$PF_IMAGE"
          docker cp pf:/opt/out/instance/server/default/lib/. pf-lib/ 2>/dev/null || \
            docker cp pf:/opt/server/server/default/lib/. pf-lib/
          docker rm pf
          mvn -q install:install-file -Dfile="$(ls pf-lib/pf-protocolengine*.jar | head -1)" \
            -DgroupId=pingfederate -DartifactId=pf-protocolengine -Dversion=13.0.0.3 -Dpackaging=jar -DgeneratePom=true
          docker create --name pfsdk "$PF_IMAGE" && { docker cp pfsdk:/opt/out/instance/sdk/lib/. pf-sdk-lib/ 2>/dev/null || docker cp pfsdk:/opt/server/sdk/lib/. pf-sdk-lib/ || true; }; docker rm pfsdk
          SDK_JAR=""; for j in pf-sdk-lib/*.jar pf-lib/*.jar; do unzip -l "$j" 2>/dev/null | grep -q "com/pingidentity/access/JwksEndpointKeyAccessor.class" && SDK_JAR="$j" && break; done
          echo "SDK jar picked by content: $SDK_JAR"; test -n "$SDK_JAR"
          mvn -q install:install-file -Dfile="$SDK_JAR" \
            -DgroupId=com.pingidentity.pingfederate -DartifactId=pingfederate-sdk -Dversion=13.0.0.3 -Dpackaging=jar -DgeneratePom=true
          # gm-api's provided deps use the local.pingfederate convention — same jars, from the image lib
          mvn -q install:install-file -Dfile="$SDK_JAR" -DgroupId=local.pingfederate -DartifactId=pingfederate-sdk -Dversion=13.0.3 -Dpackaging=jar -DgeneratePom=true
          mvn -q dependency:get -Dartifact=org.eclipse.jetty.toolchain:jetty-servlet-api:4.0.9
          SAPI=$(find ~/.m2 -name 'jetty-servlet-api-4.0.9.jar' | head -1)
          mvn -q install:install-file -Dfile="$SAPI" -DgroupId=local.pingfederate -DartifactId=servlet-api -Dversion=4.0.9 -Dpackaging=jar -DgeneratePom=true
          for spec in jose4j:1.x jackson-databind:2.x jackson-core:2.x jackson-annotations:2.x commons-lang3:3.x commons-logging:1.x; do
            a="${spec%%:*}"; v="${spec##*:}"
            J=$(ls pf-lib/${a}-[0-9]*.jar 2>/dev/null | head -1); [ -z "$J" ] && J=$(ls pf-lib/*${a}*.jar 2>/dev/null | head -1)
            echo "local.pingfederate:$a:$v <- $J"; test -n "$J"
            mvn -q install:install-file -Dfile="$J" -DgroupId=local.pingfederate -DartifactId="$a" -Dversion="$v" -Dpackaging=jar -DgeneratePom=true
          done
      - name: reactor build (tests on)
        run: mvn package
      - uses: actions/upload-artifact@v4
        with:
          name: pf-artifacts
          path: |
            servlets/pf-integration/target/oidf.war
            servlets/pf-integration/target/oidf.jar
            plugins/rar-paz-plugin/target/pf.plugins.pf-rar-paz-plugin.jar
            servlets/attestation-issuer/target/attestation-issuer-*.jar
            servlets/ssf/target/ssf-*.jar
            services/gm-api/servlet/target/gm-api.war

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/gm-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache-dependency-path: services/gm-api/go.sum }
      - run: go build ./...
      - run: go test ./...
