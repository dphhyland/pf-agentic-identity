# CI build: the whole platform, on every push/PR. The two provided PF jars (pf-protocolengine +
# pingfederate-sdk) are extracted from the public pingidentity/pingfederate image — running PF needs
# a license, extracting jars does not — so the reactor builds with no private dependencies at all.
name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  PF_IMAGE: pingidentity/pingfederate:13.0.3-alpine_3.23.4-al21-latest

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: extract provided PF jars from the image
        run: |
          docker create --name pf "$PF_IMAGE"
          docker cp pf:/opt/out/instance/server/default/lib/. pf-lib/ 2>/dev/null || \
            docker cp pf:/opt/server/server/default/lib/. pf-lib/
          docker rm pf
          mvn -q install:install-file -Dfile="$(ls pf-lib/pf-protocolengine*.jar | head -1)" \
            -DgroupId=pingfederate -DartifactId=pf-protocolengine -Dversion=13.0.0.3 -Dpackaging=jar
          mvn -q install:install-file -Dfile="$(ls pf-lib/pf-sdk*.jar pf-lib/pingfederate-sdk*.jar 2>/dev/null | head -1)" \
            -DgroupId=com.pingidentity.pingfederate -DartifactId=pingfederate-sdk -Dversion=13.0.0.3 -Dpackaging=jar
      - name: reactor build (tests on)
        run: mvn package
      - uses: actions/upload-artifact@v4
        with:
          name: pf-artifacts
          path: |
            modules/pf-integration/target/oidf.war
            modules/pf-integration/target/oidf.jar
            modules/rar-paz-plugin/target/pf.plugins.pf-rar-paz-plugin.jar
            modules/attestation-issuer/target/attestation-issuer-*.jar
            modules/ssf/target/ssf-*.jar
            services/gm-api/servlet/target/gm-api.war

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/gm-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22', cache-dependency-path: services/gm-api/go.sum }
      - run: go build ./...
      - run: go test ./...
