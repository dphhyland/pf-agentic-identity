# The two jars PingFederate provides and every module compiles against (pf-protocolengine, pingfederate-sdk),
# installed into the runner's Maven repository. Nothing else is installed: every other library a module
# borrows from PingFederate comes from Maven Central - jose4j, jackson, commons-lang3 and commons-logging at
# the version.pf.* versions the BOM holds to the image, and jakarta.servlet-api 5.0.0, the API line the
# image's Jetty ships as 5.0.2, which tools/pf-linkcheck.py checks member by member. Extracted from the public
# pingidentity/pingfederate image: running PF needs a licence, extracting its jars does not, so no private
# dependency is needed to build the reactor. PF's lib directories stay extracted in the workspace as pf-lib
# and pf-jetty-lib, because tools/pf-linkcheck.py links the built wars against both and
# tools/pf-provided-versions.py reads pf-lib.
#
# Which PingFederate comes from build/pf-version.env, the one place the version is written down: the image
# is pulled by digest, and the jars are installed under the SDK version the BOM names. A workflow
# that needs the same values in its own steps appends that file to $GITHUB_ENV; this action reads it itself
# so it cannot be handed a different image.
name: PingFederate provided jars
description: Installs the jars PingFederate provides, extracted from its public image, into ~/.m2
runs:
  using: composite
  steps:
    - name: extract provided PF jars from the image
      shell: bash
      run: |
        # A composite step runs with pipefail, which the workflow step this came from did not, so nothing here is
        # a pipeline: `ls | head -1` fails the step when its glob matches nothing, and PF names most of its jars
        # without a version, and `unzip | grep -q` can lose a match to SIGPIPE (see the note in
        # build/pingfederate/assemble-pf-runtime-war.sh). `first` is the first file a glob names, or nothing.
        first() { [ -e "$1" ] && echo "$1"; true; }
        set -a; . "$GITHUB_WORKSPACE/build/pf-version.env"; set +a
        : "${PF_IMAGE:?}" "${PF_IMAGE_DIGEST:?}" "${PF_VERSION:?}" "${PF_SDK_MAVEN_VERSION:?}"
        IMAGE="${PF_IMAGE}@${PF_IMAGE_DIGEST}"
        echo "PingFederate $PF_VERSION from $IMAGE"
        docker create --name pf "$IMAGE"
        docker cp pf:/opt/out/instance/server/default/lib/. pf-lib/ 2>/dev/null || \
          docker cp pf:/opt/server/server/default/lib/. pf-lib/
        # Jetty's jars, the jakarta servlet API among them, live one directory up from the PF libs.
        docker cp pf:/opt/server/lib/. pf-jetty-lib/
        docker rm pf
        mvn -q install:install-file -Dfile="$(first pf-lib/pf-protocolengine*.jar)" \
          -DgroupId=pingfederate -DartifactId=pf-protocolengine -Dversion="$PF_SDK_MAVEN_VERSION" -Dpackaging=jar -DgeneratePom=true
        docker create --name pfsdk "$IMAGE" && { docker cp pfsdk:/opt/out/instance/sdk/lib/. pf-sdk-lib/ 2>/dev/null || docker cp pfsdk:/opt/server/sdk/lib/. pf-sdk-lib/ || true; }; docker rm pfsdk
        SDK_JAR=""; for j in pf-sdk-lib/*.jar pf-lib/*.jar; do unzip -l "$j" com/pingidentity/access/JwksEndpointKeyAccessor.class >/dev/null 2>&1 && SDK_JAR="$j" && break; done
        echo "SDK jar picked by content: $SDK_JAR"; test -n "$SDK_JAR"
        mvn -q install:install-file -Dfile="$SDK_JAR" \
          -DgroupId=com.pingidentity.pingfederate -DartifactId=pingfederate-sdk -Dversion="$PF_SDK_MAVEN_VERSION" -Dpackaging=jar -DgeneratePom=true
