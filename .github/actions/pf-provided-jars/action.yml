# The two jars PingFederate provides and every module compiles against (pf-protocolengine, pingfederate-sdk),
# plus the jars gm-api and the RAR plugin name under local.pingfederate, installed into the runner's Maven
# repository. Extracted from the public pingidentity/pingfederate image: running PF needs a licence,
# extracting its jars does not, so no private dependency is needed to build the reactor.
name: PingFederate provided jars
description: Installs the jars PingFederate provides, extracted from its public image, into ~/.m2
inputs:
  image:
    description: the PingFederate image the jars come from
    required: true
runs:
  using: composite
  steps:
    - name: extract provided PF jars from the image
      shell: bash
      env:
        PF_IMAGE: ${{ inputs.image }}
      run: |
        docker create --name pf "$PF_IMAGE"
        docker cp pf:/opt/out/instance/server/default/lib/. pf-lib/ 2>/dev/null || \
          docker cp pf:/opt/server/server/default/lib/. pf-lib/
        # The jakarta servlet API lives with Jetty, one directory up from the PF libs.
        docker cp pf:/opt/server/lib/. pf-jetty-lib/
        docker rm pf
        mvn -q install:install-file -Dfile="$(ls pf-lib/pf-protocolengine*.jar | head -1)" \
          -DgroupId=pingfederate -DartifactId=pf-protocolengine -Dversion=13.1.3.0 -Dpackaging=jar -DgeneratePom=true
        docker create --name pfsdk "$PF_IMAGE" && { docker cp pfsdk:/opt/out/instance/sdk/lib/. pf-sdk-lib/ 2>/dev/null || docker cp pfsdk:/opt/server/sdk/lib/. pf-sdk-lib/ || true; }; docker rm pfsdk
        SDK_JAR=""; for j in pf-sdk-lib/*.jar pf-lib/*.jar; do unzip -l "$j" 2>/dev/null | grep -q "com/pingidentity/access/JwksEndpointKeyAccessor.class" && SDK_JAR="$j" && break; done
        echo "SDK jar picked by content: $SDK_JAR"; test -n "$SDK_JAR"
        mvn -q install:install-file -Dfile="$SDK_JAR" \
          -DgroupId=com.pingidentity.pingfederate -DartifactId=pingfederate-sdk -Dversion=13.1.3.0 -Dpackaging=jar -DgeneratePom=true
        # gm-api's provided deps use the local.pingfederate convention — same jars, from the image lib
        mvn -q install:install-file -Dfile="$SDK_JAR" -DgroupId=local.pingfederate -DartifactId=pingfederate-sdk -Dversion=13.1.3 -Dpackaging=jar -DgeneratePom=true
        # PF 13.1 is jakarta.servlet: gm-api compiles against the jetty jakarta servlet jar the image ships,
        # and the plugin's tests run its javax code through PF's own ee8 bridge.
        SAPI=$(ls pf-jetty-lib/jetty-jakarta-servlet-api-*.jar | head -1); test -n "$SAPI"
        mvn -q install:install-file -Dfile="$SAPI" -DgroupId=local.pingfederate -DartifactId=jakarta-servlet-api -Dversion=5.0.2 -Dpackaging=jar -DgeneratePom=true
        BRIDGE=$(ls pf-lib/pingcommons-jakarta-ee8-bridge*.jar | head -1); test -n "$BRIDGE"
        mvn -q install:install-file -Dfile="$BRIDGE" -DgroupId=local.pingfederate -DartifactId=pingcommons-jakarta-ee8-bridge -Dversion=13.1.3 -Dpackaging=jar -DgeneratePom=true
        for spec in jose4j:1.x jackson-databind:2.x jackson-core:2.x jackson-annotations:2.x commons-lang3:3.x commons-logging:1.x; do
          a="${spec%%:*}"; v="${spec##*:}"
          J=$(ls pf-lib/${a}-[0-9]*.jar 2>/dev/null | head -1); [ -z "$J" ] && J=$(ls pf-lib/*${a}*.jar 2>/dev/null | head -1)
          echo "local.pingfederate:$a:$v <- $J"; test -n "$J"
          mvn -q install:install-file -Dfile="$J" -DgroupId=local.pingfederate -DartifactId="$a" -Dversion="$v" -Dpackaging=jar -DgeneratePom=true
        done
