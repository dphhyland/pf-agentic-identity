# grype's configuration for Build's image job (https://github.com/anchore/grype#configuration): the findings in
# this repository's layers of the PingFederate image that are accepted rather than fixed, each with its reason.
# The job passes the file by name (`grype -c .github/grype.yaml`) for the image and for the pinned base image
# alike, and tools/ci/image-scan-gate.py fails on anything HIGH or CRITICAL of ours that is not accepted here.
# PingFederate's own findings need no entry: they are reported and never fail (build/pingfederate/README.md,
# "Scanning the image").
#
# An entry names one vulnerability in one package at one version, so a new vulnerability, or the same package at
# another version, is not accepted by it and fails until someone reads it. An entry that no longer matches is
# named in the job's summary; remove it then. Checked 2026-09-29 with grype 0.119.0 and the database of that day.
ignore:
  # age 1.3.2, the release binary the Dockerfile installs so pf-entrypoint.sh can decrypt the configuration archive
  # (F-0220 moved it off Alpine's package), is built with golang.org/x/crypto v0.55.0 (grype reads it from the build
  # information in /usr/local/bin/age and age-keygen). Two HIGH advisories in that module are fixed in v0.56.0, and
  # both are in golang.org/x/crypto/ssh's connection handling: a peer can deadlock a connection's undecided or
  # established channel. govulncheck 1.8.0 -mode binary on both binaries (2026-09-29) lists them under "packages
  # you import" and finds no vulnerable symbol called. age links x/crypto/ssh for SSH-key recipients and
  # identities; the entrypoint runs `age --decrypt --identity` over a local file and never opens an SSH connection.
  # age 1.3.2 (2026-08-29) is the latest release; remove these entries when one is built against x/crypto 0.56.0.
  - vulnerability: GO-2026-6354
    package: { name: golang.org/x/crypto, version: v0.55.0, location: "/usr/local/bin/age*" }
    reason: "CVE-2026-78662, ssh: a peer can deadlock a connection before a channel is established; age opens no SSH connection. F-0285"
  - vulnerability: GO-2026-6355
    package: { name: golang.org/x/crypto, version: v0.55.0, location: "/usr/local/bin/age*" }
    reason: "CVE-2026-56855, ssh: a peer can deadlock an established connection; age opens no SSH connection. F-0285"
