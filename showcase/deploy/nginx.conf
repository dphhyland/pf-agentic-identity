server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The site is three static pages plus images. No server-side anything.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed navigation means one page serves every view: never cache the HTML.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Screenshots and logos are content-addressed by their build; a day is safe.
    location ~* \.(webp|png|svg|jpg|jpeg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /index.html;
}
