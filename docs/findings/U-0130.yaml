id: U-0130
title: Whether CodeQL can analyse the iOS client's Swift only when it changes without degrading other pull requests
area: ci, ios-client
source: pr-review
status: open
plan_items: [R-CI4]
prs: [33]
recorded_in: .github/workflows/codeql.yml, the header's last paragraph
verify_by: >
  First settle the assumption: a pull request against a branch whose analyses include /language:swift, with
  the workflow skipping swift on that pull request (a path filter or a job condition) - read the code scanning
  check's conclusion and text, and whether it still reports the other categories' new alerts. Then choose, and
  record the choice here: Swift on every event, at the measured cost; Swift only when clients/ios changes, if
  the assumption proves wrong; or Swift only when clients/ios changes with the analyze step's `upload: never`
  and the job failing on any result, so that nothing reaches code scanning and no category goes missing.
verification: ''
notes: >
  Package HYG was asked to add a swift analysis that runs only when clients/ios changes, if a per-language path
  filter could do that without weakening the other languages. A pull request whose analyses lack a category
  main has is reported as "Code scanning cannot determine the alerts introduced by this pull request, because
  1 configuration present on refs/heads/main was not found" - the title of github/codeql discussion 18506,
  which reports it for /language:swift - and a GitHub staff answer in community discussion 153284 says to keep
  such an analysis running on pull requests; GitHub's own documents do not describe the case (read
  2026-09-27). Swift on every event works: PR #33's run 36309012583 (2026-09-27) analysed AgentIdentityKit on
  macos-latest (Xcode 26.6, Swift 6.3.3, inside CodeQL's supported "Swift 5.4-6.3") with a manual
  `swift build --arch arm64`, as GitHub's CodeQL build notes recommend, and found nothing with 27 rules. But it
  took 13 min 35 s, 11 min 37 s of it the traced build, against about 5 min for Java, on every pull request.
  So codeql.yml leaves Swift out for now, and this records the question.
