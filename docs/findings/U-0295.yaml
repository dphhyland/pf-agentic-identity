id: U-0295
title: What /pf/heartbeat.ping answers on an engine node while it syncs its configuration from the admin node has not been seen
area: build, image
source: design
status: open
plan_items: [R-I3]
prs: [68]
recorded_in: build/pingfederate/README.md, The healthcheck; docs/releases/unreleased/RI3.md, Notes
verify_by: >
  On a clustered rig (an admin node and an engine node), start the engine node against an admin node that has not
  replicated yet and record, every few seconds until replication, what /pf/heartbeat.ping and
  /agentic-identity/health/live answer on the engine's runtime port and what the image's healthcheck reports.
verification: ''
notes: >
  Package RI3 (2026-09-29) read the pinned 13.1.3 image: its liveness.sh waits for /tmp/ready only on a standalone or
  admin node and otherwise asks the heartbeat for any answer, and pf-healthcheck.sh adds 200 from the heartbeat and
  from live. Only a standalone rig was booted, where both answered 200 once PingFederate had started. If an engine
  node answers 200 before it has its configuration, the healthcheck calls it healthy early; if it answers
  something else for longer than the start period and seven checks, an orchestrator restarts a node that was
  only waiting.
