id: F-0221
title: Alpine's age 1.3.1-r6 is built with golang.org/x/crypto v0.45.0, whose SSH code carries twelve HIGH and CRITICAL advisories, accepted in the image scan
severity: low
area: build, image
source: design
status: accepted
expiry: 2026-12-28
plan_items: [R-I3, R-CI6]
prs: [58]
verification: >
  Checked 2026-09-28 by package RCI6: grype 0.119.0 finds golang.org/x/crypto v0.45.0 in /usr/bin/age, age-keygen,
  age-inspect and age-plugin-batchpass of the capability image (the Alpine package age 1.3.1-r6), with twelve
  HIGH or CRITICAL advisories fixed in x/crypto 0.52.0, 0.55.0 or 0.56.0. govulncheck 1.8.0 -mode binary over the
  image's age binaries places every one in golang.org/x/crypto/ssh, ssh/agent or ssh/knownhosts. Each is accepted
  in .github/grype.yaml with its reason.
target_release: 0.6.0
notes: >
  age links x/crypto's SSH packages for SSH-key recipients and identities. pf-entrypoint.sh runs it only as
  `age --decrypt --identity` over a local file: it opens no SSH connection, runs no SSH server, talks to no agent
  and reads no known_hosts file, which is where the advisories are. The one that key parsing reaches,
  GHSA-w879-237q-wc7r (pathological RSA or DSA parameters, a denial of service), needs the operator's own identity
  to be a malformed SSH key, and stops that container booting. Accepted until Alpine rebuilds age against a fixed
  x/crypto or R-I3 stops installing it from Alpine (F-0220); an entry that stops matching is named in the image
  job's summary, and a new advisory in the same module is not covered by these entries and fails the job.
