id: U-0018
title: Issuance criteria see context.OAuthAuthorizationDetails
area: pf-integration
source: design
status: closed
plan_items: [S4d]
prs: []
recorded_in: the plan, To verify before relying on it, booted PingFederate item 3
verify_by: >
  An access token mapping on the rig with a criterion over context.OAuthAuthorizationDetails, exercised with
  and without details.
verification: >
  Verified by S4D3 on the rig on 2026-09-30 (pfai-p3-s4d3, PingFederate 13.1.3, origin/main cf5b8bce), with OGNL
  expression attributes on both access-token mappings read back from the issued JWT:
  context.OAuthAuthorizationDetails is an org.sourceid.saml20.adapter.attribute.AttributeValue whose
  getAllObjectValues() are java.util.LinkedHashMap, one per detail about to be issued (isMultiValue true with two),
  numbers as PingFederate's JSON reader made them (Integer 500, Double 100.25), and null when nothing is issued.
  Client credentials: the request's details. Code after PAR: the pushed details. Refresh without the parameter: the
  grant's; with a narrower one: the narrower. CIBA: what bc-auth stored. Device: what the device endpoint stored. The
  criterion also sees the grant type and the authorization_details parameter through context.HttpRequest, and
  PingFederate evaluates the mappings' criteria where the authorization endpoint resumes, too.
