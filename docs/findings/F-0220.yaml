id: F-0220
title: The base image ships without apk's installed database, so the image's apk add reinstalls PingFederate's whole Alpine userland at the day's versions
severity: medium
area: build, image
source: design
status: closed
plan_items: [R-I3, R-CI6]
prs: [58, 68]
verification: >
  Closed 2026-09-29 by package RI3 (PR #68). No stage that ships runs apk: age 1.3.2 comes from its GitHub
  release, checked against a sha256 recorded per architecture before it is unpacked, and bash is installed only in
  the builder stage. Build's image job lists every file, link and directory under /bin, /sbin, /lib, /usr, /etc and
  /var in the base image and in each capability image and fails unless the only differences are age, age-keygen and
  age's licence; locally on 2026-09-29 the listings differed by exactly those five lines. zlib's CVE-2026-85091
  entry is gone from .github/grype.yaml: the base's zlib is PingFederate's again.
target_release: 0.6.0
notes: >
  Found by package RCI6 (2026-09-28). pingidentity/pingfederate at the digest build/pf-version.env pins has no
  /lib/apk/db/installed (its /lib/apk/db holds only lock, scripts.tar.gz and triggers), so apk believes nothing is
  installed. The Dockerfile's `apk add --no-cache age` therefore installs every package in the base's
  /etc/apk/world as well as age - 57 packages, from musl and busybox to git, openssh-client and the fonts - at
  whatever versions Alpine's index serves on the day of the build (the image's /var/log/apk.log, 2026-09-28: the
  alpine-release 3.24.2-r0 and apk-tools 3.0.8-r0 packages, where the base's /etc/alpine-release reads 3.24.1 and
  its own apk.log was written by apk-tools 3.0.6-r0), and writes .apk-new copies of
  /etc/passwd, /etc/shadow, /etc/group and /etc/hosts. Three consequences. The Alpine layer PingFederate built and
  tested is replaced by ours in every image this repository builds. Two builds of one commit on different days
  differ (the before and after listings RCI6 took differ in /etc/shadow, the fontconfig caches and apk.log for
  this reason alone). And a scanner cannot see the base image's own Alpine packages, so their findings are
  reported against our layer, where tools/ci/image-scan-gate.py counts them as ours: zlib 1.3.2-r0's
  CVE-2026-85091 is accepted in .github/grype.yaml on that ground. Who: R-I3 (Phase 3), which already rewrites the
  Dockerfile's bake-ins - install age without apk (a release binary pinned by checksum, as
  tools/ci/install-lint-tools.sh does) or ask apk for age alone, and drop bash once nothing in the image needs it.
