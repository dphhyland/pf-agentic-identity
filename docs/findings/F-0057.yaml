id: F-0057
title: 'SSF events and audit source: txn and assurance-level-change wired, a broader audit vocabulary, valid credential_type, re-attach after a log4j reconfigure'
severity: medium
area: ssf
source: reviewer-report
status: closed
plan_items: [H-SSF-5]
prs: [97]
verification: >
  Closed 2026-10-01 by package HSSF3 (PR #97). Every SET SsfEventEmitter mints carries a txn, one per underlying
  event: the audit record's (or the logout request's) PingFederate transactionid, or a random value per event - never the
  trackingid, which PingFederate calls unique for a user session (SSF 1.0 §4.1.9). assurance-level-change is raised
  through events:emit or SsfEventBridge.onAssuranceLevelChange with CAEP 1.0 §3.4.1's namespace, current_level,
  previous_level and change_direction; PingFederate 13.1.3's audit records carry no level, so the audit source cannot
  raise it. The default vocabulary is every PingFederate 13.1.3 audit event that maps to one CAEP or RISC event without
  ambiguity (SLO, SRI_REVOKED, AUTHN_SESSIONS_DELETED, AUTHN_SESSION_CREATED, PWD_CHANGE, ACCOUNT_DELETE; the table and
  the reasons for the rest in servlets/ssf/README.md). credential-change carries only a CAEP 1.0 §3.3.1 credential_type,
  and an unnamed one is dropped (ssf.set.dropped credential_type), never sent as "credential". The audit source listens
  for log4j's PROPERTY_CONFIG and re-attaches: on the rig (13.1.3, log4j 2.25.4, 2026-10-01) a touch of log4j2.xml gave
  detached and attached (trigger=reconfigure, loggers=6) four seconds later. Platform's lifecycle detaches it at undeploy.
  The CAEP plan (Rx8fy4v52mDwr) passed 13 of 13 and the SSF plan (7VvB7uhXQFfNs) 19 of 19, the CAEP SETs carrying txn.
target_release: 0.6.0
