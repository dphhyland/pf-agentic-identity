id: F-0075
title: The RAR plugin logs through java.util.logging, which PingFederate 13.1.3 writes to server.log as ERROR [SystemErr]
severity: low
area: rar-paz-plugin
source: pr-review
status: open
plan_items: [O-6]
prs: []
verification: ''
target_release: 0.7.0
notes: >
  Seen on the rig on 2026-09-27 (13.1.3.0, conformance/verify-rar-principal.sh, its saved server.log): every line
  AttestationAwareRarProcessor logs - the INFO "RAR governance:" summary included - reaches server.log as two
  lines, "ERROR [SystemErr] <date> com.pingidentity.ps.oidf.rar.AttestationAwareRarProcessor enrich" and the
  message, because java.util.logging's console handler writes to standard error and PingFederate logs
  standard error at ERROR. The level an operator filters or alerts on is therefore wrong for every line, and
  one enrich is an ERROR pair in the log whether it permitted or not. O-6 (logging) is where the plugin should
  move to the logging PingFederate routes through log4j (commons-logging, as the servlets use), with the
  hashing of principals kept.
