id: F-0317
title: A trust-chain+json registration body whose statement is not a JWT was answered 500, not 400
severity: low
area: pf-integration
source: design
status: closed
plan_items: [S5c]
prs: [73]
verification: >
  Found 2026-09-30 on the conformance rig (slot 5, the image built from prod/p3-registration-hardening at 6dcdf420,
  PingFederate 13.1.3): POST /federation/register with Content-Type application/trust-chain+json and the body
  ["a.b.c"] was answered 500 server_error, with a JwtVerificationException from
  TrustChainValidator.selectLeafEntityStatement logged at ERROR with its stack. ExplicitRegistrationRequest.fromTrustChainJson
  now turns anything but its own IllegalArgumentException into one, so the servlet answers 400 invalid_request;
  OpenIdRegistrationBodyCapTest.aTrustChainBodyWhoseStatementIsNotAJwtIsA400NotA500 holds it.
target_release: 0.6.0
notes: >
  A malformed request is the caller's fault; a 500 with a stack trace at ERROR for every one made the log an easy
  thing for a stranger to fill, and told the caller nothing. The entity-statement+jwt body already turned a statement
  that does not parse into a 400.
