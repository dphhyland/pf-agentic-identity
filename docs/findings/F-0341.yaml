id: F-0341
title: The ENCRYPTED_REQUEST_OBJECTS and REQUIRE_PKCE catalogue texts and the pkce-off risk describe what HFEDR changed
severity: low
area: pf-integration
source: design
status: open
plan_items: [ST-5]
prs: []
verification: ''
target_release: 0.7.0
notes: >
  federation-runtime.json (ST5F's, wave 5; HFEDR may not edit it) describes allow as "an encrypted request object
  registers the relying party from its header, and PingFederate checks the rest after decrypting", and
  docs/configuration/federation-runtime.md is generated from it. From HFEDR (2026-09-30) allow means that a registered
  RP's encrypted request objects go on to PingFederate; one registers or renews an RP only under the development
  profile. servlets/pf-integration/README.md and docs/federation/limits.md say so. ST5F rewrites the description and
  regenerates the page. The same package made OIDF_AUTO_REGISTRATION_REQUIRE_PKCE, and so the pkce-off accepted risk,
  cover relying parties registered explicitly at /federation/register as well as those registered at the front
  channel; the texts still say front channel only - AcceptedRisk.PKCE_OFF's description (libs/platform), the
  setting's description in federation-runtime.json, docs/configuration/federation-runtime.md (generated) and
  libs/platform/README.md. ST5F rewords the setting and the page; the platform's owner rewords the risk.

  Retargeted from 0.6.0 to 0.7.0 on 2026-10-01 by the v0.6.0 release package, still open on origin/main 600fa6b5:
  federation-runtime.json still describes OIDF_AUTO_REGISTRATION_ENCRYPTED_REQUEST_OBJECTS=allow as registering the
  relying party from the header, and OIDF_AUTO_REGISTRATION_REQUIRE_PKCE and AcceptedRisk.PKCE_OFF as front-channel
  only (AcceptedRisk.java line 30); ST5F did not reword them. HFEDR's release note says what each now does. A
  catalogue and code change, which the release package does not make. The programme plan gives it no later item of
  its own, so David schedules it.
