id: F-0021
title: Registration expiry is not enforced when an attestation request names no client_id
severity: medium
area: pf-integration
source: review-2026-09-26
status: closed
plan_items: [H-FED-2]
prs: [78]
verification: >
  Closed 2026-09-30 by HFEDR (PR #78). TokenEndpointAutoRegistrationFilter.clientIdOf names the client from the
  client_assertion's sub, then client_id, then the OAuth-Client-Attestation header's sub (unverified; two
  attestation headers name nothing). Because ClientAttestationAuth never compares a client_assertion with the
  attestation, and forwards the request as the attestation's sub with the bridge's assertion in its place, doFilter
  also looks up the attestation's sub (attestedClientOf) when it differs from the name clientIdOf chose, so a decoy
  client_assertion naming another client cannot carry the request past the attested client's expiry (found by the
  package's adversarial review, 2026-09-30). ClientAttestationAuth, mapped after this filter
  (build/pingfederate/filters.xml), refuses the request unless the verified sub is the one it read first. Tests:
  TokenEndpointAutoRegistrationFilterTest.clientIdOfReadsTheAssertionThenClientIdThenTheAttestation,
  anAttestedRequestForAnExpiredRegistrationIsRefused (a real RegistrationService: an expired explicit registration
  named only by the attestation is 401 invalid_client, a current one goes on),
  aDecoyAssertionDoesNotCarryAnAttestedRequestPastItsExpiry and
  anAttestedRequestLooksUpTheAttestedClientAsWellAsTheNamedOne; JDK 17 and 20, 2026-09-30.
target_release: 0.6.0
notes: >
  TokenEndpointAutoRegistrationFilter.java:152-156 (f95b522) looks the client up by `client_id`, which an
  attested request need not send, so its registration's expiry is not checked. H-FED-2 names the client from
  the attestation's `sub`.
