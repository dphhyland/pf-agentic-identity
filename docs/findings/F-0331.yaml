id: F-0331
title: An unreachable receiver JWKS is not a start-up dependency, so SSF_RECEIVER is READY while every SET is refused
severity: low
area: ssf
source: design
status: open
plan_items: [ST-5, H-SSF-1]
prs: []
verification: ''
target_release: 0.6.0
notes: >
  Found by ST5C (2026-09-30). The package's specification asked for a JWKS that cannot be reached to be
  FAILED_DEPENDENCY. The receiver's JWKS (OIDF_SSF_RECEIVER_JWKS_URL) is fetched by JwksHttpSource on the first SET
  and cached, not at start-up, so a start function has nothing to fail on: SSF_RECEIVER is READY and each SET is
  answered 400 until the JWKS answers. Fetching it in the start would make a receiver's readiness depend on the remote
  transmitter being up, which is a choice for the receiver's owner, and the fetch is S5D's to move onto
  OutboundHttp. The transmitter's own keys are PingFederate's, read in process. Who and when: HSSF1 (Phase 3, wave 4),
  which owns the receiver, decides whether the start fetches the JWKS once.
