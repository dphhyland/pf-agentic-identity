id: F-0090
title: 'The showcase''s file:line citations into release.yml point at the wrong lines'
severity: low
area: showcase
source: pr-review
status: closed
plan_items: [D-3]
prs: [33]
verification: >
  2026-09-27, at origin/main 714e7ce: every citation of .github/workflows/release.yml in showcase/index.html's
  DATA line (release.yml:10-25, 27-34, 266-267, 277-281, 283-293, 289-291, 290 twice, 291, 292, 293 and
  384-392) was printed beside the lines it names, and each names the lines its statement describes: the header's
  order and channels, the provided-jars step, the production stage, the dist/ copies of the module set,
  oidf.war, the RAR plugin, the instance-registry datasource and gm-api.war, and the Packages deploy. PR #33
  (package HYG) re-read and corrected them after the release gate's rewrite.
target_release: 0.4.0
notes: >
  showcase/index.html's DATA line cites .github/workflows/release.yml by line eleven times: the release assets,
  the plugin and war copies, the Packages deploy, the composite action and the pipeline. On origin/main ab74038
  all but the header's (26-33) already point five to seven lines early, since the CI-hygiene and image-profile
  pull requests grew the file: `release.yml:147` for the `oidf.war` copy, which is line 153; `124-125` for the
  provided jars, which is the key-material check (the composite action is at 129-130); `240-248` for the
  Packages deploy, which starts at 247. The release gate's rewrite (branch prod/p1-release-gate-waits,
  2026-09-27) moves every line below the header's second item down by one and every line below the gate down
  by 118 in all: the `oidf.war` copy to 271, the deploy step to 365. check-showcase-links.py checks only that a
  cited line exists ("It can't tell whether the lines still say what the statement says"), so CI stays green
  while a reader following a citation lands on the wrong code. The fix: once the gate change is on main,
  re-read each release.yml citation against the statement it backs and correct the ranges. D-3 (the showcase
  built from showcase/src) is where citations stop being hand-kept.
