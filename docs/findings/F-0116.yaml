id: F-0116
title: 'Behind a proxy, every caller shares one challenge allowance: the cap counts remote addresses'
severity: medium
area: client-attestation, attestation-issuer
source: pr-review
status: closed
plan_items: [H-ATT-3]
prs: [89]
verification: >
  2026-09-30, branch prod/p3-issuance-endpoint (HATT2): both challenge endpoints count callers by
  TrustedProxies.clientAddress - the remote address, or behind a proxy OIDF_TRUSTED_PROXIES lists the right-most
  forwarding hop it does not list - and a list that cannot be read leaves the endpoint FAILED_CONFIG.
  ChallengeEndpointTrustedProxyTest shows, for the authorization server's and the attester's endpoint, two clients
  behind one listed proxy with an allowance each, a forged chain counted by the hop the proxy appended, and with the
  list unset the proxy's one allowance shared, as the 2026-09-27 rig result above found. Not re-run on the rig:
  PingFederate's own handling is U-0400.

target_release: 0.6.0
notes: >
  Found on 2026-09-27 in S4b. Both challenge endpoints cap each caller at 60 requests a minute by default, and
  count callers by HttpServletRequest.getRemoteAddr() (ChallengeEndpointServlet.java:125-126), reading no
  forwarding header. On a booted PingFederate 13.1.3 with its default proxy settings (the S4b rig, 2026-09-27),
  61 GETs to /federation/attestation/challenge carrying 61 different X-Forwarded-For values were counted as one
  caller: the requests past 60 in the window answered 429 slow_down. So behind a load balancer or TLS terminator
  that PingFederate does not see through, all agents share one allowance per endpoint, and one busy or hostile
  client makes every other client's challenge fetch fail for up to a minute - which, where challenges are
  required, fails their attestation. Each endpoint has its own allowance (the authorization server's still
  answered 200 once the attester's was spent). Medium: availability, and the cap's per-caller promise does not
  hold behind a proxy. H-ATT-3 (trusted proxies only for X-Forwarded-*) gives the cap a trustworthy client
  address; until then, size challengeRateLimitPerWindow for the whole population behind the proxy.
