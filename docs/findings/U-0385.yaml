notes: >
  Package PLG ran the decision tests (2026-09-30) against the Policy Editor's own decision endpoint,
  /api/governance-engine, with the request shape GovernanceEngineRequestBuilder writes; the processor calls a
  PingAuthorize Server's /governance-engine instead, and that server asks the Policy Editor. The paz/ compose file
  runs no PingAuthorize Server (the one it used to run mounted a profile from a checkout beside this one, and its
  licence expired 2026-08-12; U-0302). The processor's handling of each narrowing's statement is unit-tested
  (StatementApplier, ModelGate.within), not seen end to end.
