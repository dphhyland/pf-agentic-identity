id: F-0041
title: 'The attestation_* extended properties are not in docs/extended-properties.json'
severity: high
area: pf-integration
source: design
status: closed
plan_items: [S4c, ST-3]
prs: [64]
verification: >
  Closed by ST4 on 2026-09-29 (PR #64). docs/extended-properties.json is now generated by
  tools/config-reference.py from every catalogue's extended-property entries, and the Build workflow's lint job
  fails when it is not current. Read on 2026-09-29: the file lists 34 names, the ten it listed before plus the
  nine per-client attestation_* properties and three trust_chain_* limits of pf-integration's client-properties
  catalogue and the twelve attestation_* names of attestation-issuer's issuance-client-properties.
  conformance/terraform/extended-properties.tf declares whatever the file lists: terraform validate passes on it,
  and terraform console on the same configuration evaluates local.federation_extended_properties to the same 34
  names. FederationClientParamsTest holds FederationClientParams.EXTENDED_PARAM_NAMES to the client-properties
  catalogue, and the settings scan holds each catalogued extended property to a read in the code. The release
  note's "Declare the new extended properties" tells a consumer that diffs its Terraform against the file to
  declare the new names.
target_release: 0.6.0
notes: >
  Found while designing, item 12. PingFederate drops an extended property it has not been told about, without
  a word, so per-client attestation policy written to a client is lost. High: a policy an operator believes is
  applied is not. S4c's start-up scan checks the properties are declared (ExtendedPropertyAccessor) and puts
  clients with bad properties into health; ST-3 makes the file generated from the catalogue. A live PingFederate
  was not asked to accept the new names when this closed: the rig was not booted for ST4, so the provider's
  schema is what checked them.
