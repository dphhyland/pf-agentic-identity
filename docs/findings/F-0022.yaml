id: F-0022
title: Logout signal replay
severity: medium
area: ssf
source: review-2026-09-26
status: closed
plan_items: [H-SSF-6]
prs: [97]
verification: >
  Closed 2026-10-01 by package HSSF3 (PR #97). LogoutEventFilter raises session-revoked only for an id_token_hint
  that PfIdTokenVerifier accepts - signed by this PingFederate and issued by it (PfInternals.issuer), an ID token (no typ
  or typ JWT; iss, sub, aud, exp and iat; no events, client_id or scope), its iat within
  OIDF_SSF_LOGOUT_HINT_MAX_AGE_SECONDS (default 86400) and no more than five minutes ahead - only when the chain returned
  with a status below 400 and no error redirect, and at most once per (sid or subject, iat) within the bound; each
  refusal is an ssf.logout.signal.refused event with its reason. A logout_token parameter is no longer read. On the rig
  (PingFederate 13.1.3, 2026-10-01, plan logs in the PR): the same hint presented twice raised one signal and one
  refusal (replayed), the login's access token as the hint was refused (hint_not_id_token) where 0.5.0 raised a signal
  for it, and a malformed hint was refused (hint_invalid). What the filter cannot see - whether PingFederate's sign-off
  itself completed, which on 13.1.3 happens after the user's confirmation on a later request - is F-0401.
target_release: 0.6.0
notes: >
  LogoutEventFilter emits CAEP session-revoked from the `id_token_hint` presented at /idp/init_logout.openid;
  it bounds neither the token's age nor whether PingFederate's logout succeeded, and does not check the token
  type, so a captured hint can raise the signal again. H-SSF-6: emit only when the logout succeeded, bound the
  id_token's age, check the token type.
