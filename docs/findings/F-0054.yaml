id: F-0054
title: 'SSF poll: cap maxEvents, parse setErrs, long polling, respect stream status'
severity: medium
area: ssf
source: reviewer-report
status: closed
plan_items: [H-SSF-2]
prs: []
verification: >
  Closed 2026-09-30 by package HSSF1 (plan item H-SSF-2). maxEvents is capped at OIDF_SSF_POLL_MAX_EVENTS_CAP
  (default 100, 1-1000); setErrs is parsed, each entry logged, counted as ssf.poll.set_error under its error code and
  the SET released; a paused or disabled stream returns no SETs (SSF 1.0 §8.1.2.1); a poll whose returnImmediately
  is not true is a long poll, held in async mode for up to OIDF_SSF_POLL_LONG_POLL_WAIT_SECONDS (default 10, 0-30)
  and released by a SET or the wait, checked by one managed executor. PollDeliveryTest, SsfLongPollTest. On
  PingFederate 13.1.3 the chain in front of /ssf/poll is not async-capable, so the poll is answered at once (F-0360).
  The SSF poll plan (sZoXwU7pXFdZu, 19 of 19) and the CAEP plan (U7kyNRApD03H1, 13 of 13) passed on the rig on
  2026-09-30.
target_release: 0.6.0
notes: >
  From the seven reviewer reports of 2026-09-26, as Workstream H of the plan lists it (Phase 3). Medium by the
  register's rule for these items.
