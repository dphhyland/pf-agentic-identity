id: F-0032
title: Omitting authorization_details at the token endpoint skips the attestation ceiling on code, CIBA and device grants
severity: blocker
area: pf-integration
source: design
status: closed
plan_items: [S4d]
prs: [81]
verification: >
  Closed by S4D3 on 2026-09-30, after S4D1 (PR #81) held details where PingFederate stores them (PAR, CIBA, the
  device endpoint). IssuedDetailsCriterion.withinCeiling on an access-token mapping holds what is about to be issued
  (context.OAuthAuthorizationDetails) to the attestation's authorization_details by the model's strict contains on
  every grant, and the response belt IssuedDetailsBelt holds the token response of every attested request. On the rig
  (slot 2, pfai-p3-s4d3, PingFederate 13.1.3, 2026-09-30): a code grant pushed under a ceiling of sales_agent [EMEA,
  AMER] up to 500 and redeemed, with no authorization_details, under an attestation of [EMEA] up to 100 was refused
  400 invalid_authorization_details by the belt with the criterion off (the grant revoked) and 400 invalid_grant by
  the criterion with it on; CIBA the same was refused by the belt; code, CIBA, device and client-credentials grants
  within the ceiling were issued. IssuedDetailsCriterionTest and IssuedDetailsBeltTest hold each grant and each
  refusal.
target_release: 0.6.0
notes: >
  Found while designing, item 3. Code, CIBA and device grants issue the details stored at authorize or PAR;
  the filter's ceiling check reads only the token-request parameter, so leaving it out skips the check, and
  details pushed at PAR are enriched with no attestation context. Blocker: the containment control can be
  bypassed on three grant types by omitting a parameter, which the plan calls the most serious finding. S4d
  maps the filter over PAR, bc-auth, introspect and revoke, rewrites the forwarded parameter to the granted
  details, and adds a response belt on the token endpoint and an issuance criterion on
  context.OAuthAuthorizationDetails.
