id: F-0285
title: age 1.3.2's release binaries are built with golang.org/x/crypto v0.55.0, whose SSH connection code carries two HIGH advisories, accepted in the image scan
severity: low
area: build, image
source: design
status: accepted
expiry: 2026-12-29
plan_items: [R-I3]
prs: [68]
verification: >
  Checked 2026-09-29 by package RI3: grype 0.119.0 finds golang.org/x/crypto v0.55.0 in /usr/local/bin/age and
  age-keygen of both capability images, with GO-2026-6354 (CVE-2026-78662) and GO-2026-6355 (CVE-2026-56855), both
  HIGH and fixed in v0.56.0. govulncheck 1.8.0 -mode binary on both binaries lists them under the packages the
  binaries import and finds no vulnerable symbol called. Each is accepted in .github/grype.yaml with its reason.
target_release: 0.6.0
notes: >
  Found by package RI3 (2026-09-29), when F-0220 moved age off Alpine's package (1.3.1-r6, x/crypto v0.45.0, twelve
  advisories accepted under F-0221) to age's own 1.3.2 release, the latest on that day (2026-08-29). Both advisories
  are in golang.org/x/crypto/ssh's connection handling: a peer can deadlock a connection before a channel is
  established, or an established one. age links x/crypto/ssh for SSH-key recipients and identities;
  pf-entrypoint.sh runs it only as `age --decrypt --identity` over a local file and never opens an SSH connection.
  Remove the entries, and close this, when an age release is built against x/crypto 0.56.0 or later: change
  AGE_VERSION and both sums in the Dockerfile. F-0221 is superseded by this and is not RI3's to close.
