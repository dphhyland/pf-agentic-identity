id: F-0069
title: 'release.yml''s green-Build gate fails while Build on the tagged commit is still running'
severity: medium
area: release, ci
source: phase-0-review
status: closed
plan_items: [P0-6, P0-8]
prs: []
verification: >
  Closed on branch prod/p1-release-gate-waits (PR number filled in when it is opened), 2026-09-27. release.yml's
  step "a green Build on this commit" reads the tagged commit's check runs (`filter=all`) every 30 s for up to
  20 min while a required job has not concluded, judges the newest run of each job (the highest id), and fails
  at once on any conclusion but success, after 120 s when a required job has no check run, after three refused
  reads in a row, and at the limit, logging what it waits for and for how long. Its run block, extracted from
  the workflow (identical to Ruby psych's reading of the YAML but for the three timing constants, shortened to
  1 s, 8 s and 3 s), passed 22 cases against a stand-in gh serving canned check-run responses rendered with the
  step's own jq filter, under bash 3.2 on macOS and bash 5.2 in ubuntu:24.04 (GNU sed, sort and grep, mawk),
  each with -e and with -e -o pipefail: queued then in_progress then success passed at the third read; a Build
  never started failed at the grace; failure, cancelled, skipped, timed_out and a conclusion of null each failed
  at the first read; a job that never concluded failed at the limit; two runs of one name were judged by the
  newest in either list order; one refused read was retried and three in a row failed. Run read-only against
  the API with the real gh: 97e5650 passed at the first read, b1439c3 (no check runs) failed as never started,
  5d7c30f (only `java`) failed naming the two jobs it lacks, and a SHA GitHub does not have failed after three
  refused reads. origin/main's step, given the first case, failed at the first read, as v0.3.0's release did.
  actionlint 1.7.12 (with shellcheck 0.11.0 over the run blocks) and zizmor 1.30.1 are clean. Not dispatched:
  the next tag is the change's first live run. v0.3.0 itself was published by the re-run of run 36278709651
  (2026-09-27T00:14Z), which is what P0-8 needed.
target_release: 0.4.0
notes: >
  The v0.3.0 tag landed seven seconds after PR #11's merge commit 97e5650 (2026-09-26T23:12Z): Build run
  36278704385 on the commit was created at 23:12:21Z, Release run 36278709651 at 23:12:28Z, and the
  release's step "a green Build on this commit" read the check runs at 23:12:35Z, saw `java` in_progress and
  failed - the step treats anything but success as a failure and never waits. Build succeeded at 23:16:12Z.
  So on 2026-09-27 `gh release view v0.3.0` answers "release not found": the first 13.1 release is tagged
  and not published. The gate fails closed, so nothing unsafe happened; medium because the release process
  does not do what release.yml's own comment says ("the Build workflow is green on this exact commit")
  whenever a tag is pushed straight after a merge, which is how every release will be tagged. Two fixes,
  either is enough: the step waits, polling the check runs until every required one has completed or a
  deadline passes, and only then judges; or the tag is pushed only once Build on the commit is green. Until
  one lands, David re-runs the failed run on the tag (`gh run rerun 36278709651`); that publishes 0.3.0
  (P0-8) and closes nothing here.
