id: F-0048
title: 'FapiResourceServerFilter is not per client; OAuthErrorDescriptionFilter buffers every response'
severity: medium
area: pf-integration
source: reviewer-report
status: closed
plan_items: [H-FED-6]
prs: []
verification: >
  2026-10-01, on prod/p3-federation-errors (HFEDE): FapiResourceServerFilter holds only the clients
  OIDF_FAPI2_CLIENTS names (the client_id of a JWT access token, unverified, as Fapi2ProfileFilter reads it at
  UserInfo; * for every client), and finds a query token on the percent-decoded parameter name in any case, repeated
  or not (FapiResourceServerFilterTest everySpellingOfTheNameIsTheSameParameter, aClientTheListDoesNotNameIsLeftToPingFederate,
  everyClientUnderTheWildcard, unsetTheFilterDoesNothing). OAuthErrorDescriptionFilter decides at a body's first byte:
  an error status is held and sanitised, anything else goes straight through; a sendError or reset after a body was
  held drops what was held (OAuthErrorDescriptionFilterTest aTwoHundredBodyGoesOutAsItIsWrittenNotAtTheEnd,
  aSendErrorAfterTheBodyWasHeldDropsWhatWasHeldAndReachesTheContainer,
  aResetAfterTheBodyWasHeldStartsOverAndTheNextBodyIsDecidedAfresh). On the rig (13.1.3):
  ?access%5Ftoken= with a token naming conformance-fapi2-client1 was 400 with x-fapi-interaction-id, and the
  conformance-ssf-emitter's real token in ?access_token= went on to PingFederate (403 insufficient_scope, no
  x-fapi-interaction-id); a client-credentials token response and PingFederate's own 400 passed the description filter.
target_release: 0.6.0
notes: >
  From the seven reviewer reports of 2026-09-26, as Workstream H of the plan lists it (Phase 3). Medium by the
  register's rule for these items. H-FED-6: FapiResourceServerFilter per client, checked on the
  percent-decoded query; OAuthErrorDescriptionFilter buffers only error responses and handles sendError and
  reset.
  Closed by HFEDE (H-FED-6), 2026-10-01. The clients are OIDF_FAPI2_CLIENTS's - FAPI 2.0 Security Profile (final)
  section 5.3.4 has the same resource-server rule ("shall not accept access tokens in the query parameters stated in
  Section 2.3 of OAuth 2.0 Bearer Token Usage [RFC6750]") - and a new setting's, OIDF_FAPI_RESOURCE_CLIENTS, for FAPI
  1.0 clients: the conformance rig's FAPI-CIBA clients need the rules at UserInfo (the plan fails its positive modules
  without x-fapi-interaction-id, filters.xml records) but address their client assertions to the token endpoint, which
  Fapi2ProfileFilter's audience rule would refuse if they were on the first list. A reference token names no client and
  is held to the rules only under *.
