id: F-0332
title: A Kafka publisher that cannot be built leaves SSF READY with no fan-out and one ERROR
severity: low
area: ssf
source: design
status: open
plan_items: [ST-5, H-SSF-7]
prs: [82]
verification: ''
target_release: 0.6.0
notes: >
  Found by ST5C (2026-09-30), read in the code. SsfSupport.buildPublisher catches what KafkaSetPublisher.create
  throws, logs "SSF Kafka publisher disabled" at ERROR and uses the no-op publisher, so with
  OIDF_SSF_KAFKA_ENABLED=true and the Kafka client missing, or its properties refused, SSF is READY and no SET reaches
  Kafka; health does not show it. ST5C left it alone because the Kafka publisher and its settings are HSSF3's (plan
  decision 17 and the wave table). Who and when: HSSF3 (Phase 3, wave 6), with the Kafka TLS settings: a publisher
  switched on that cannot be built is FAILED_CONFIG, or DEGRADED with its reason, rather than READY.
