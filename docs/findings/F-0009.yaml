id: F-0009
title: Attestation policy is dead on the filter path
severity: high
area: pf-integration
source: review-2026-09-26
status: closed
plan_items: [S-4, S4a, S4b, S4c, S4d]
prs: []
verification: >
  Closed by S4C on 2026-09-30. AttestationPolicyResolver gives ClientAttestationAuthFilter and the OGNL criterion
  one policy per client: the server's, tightened by the client's attestation_* extended properties, which are read
  from PingFederate's client manager (PfInternals.getClient, 13.1.3), parsed strictly and able only to tighten; a
  value that does not parse or would loosen refuses the client (401 invalid_client). The filter publishes the
  policy's fingerprint and the criterion refuses a reused verification whose fingerprint differs from its own.
  AttestationPolicyRoutesTest drives both routes over one table of 19 client-property rows with real attestations
  and proofs and they agree on every row (2026-09-30). On the rig (PingFederate 13.1.3, pfai-p3-s4c, 2026-09-30) a
  client with attestation_dpop_max_age=30 was refused at the filter for a proof 120 s old and issued a token for a
  fresh one; with attestation_dpop_max_age=3600 it was refused as an invalid policy and the start-up scan listed it
  in health.
target_release: 0.6.0
notes: >
  Per-client attestation policy (the `attestation_*` extended properties) is read by the OGNL criterion route
  and not by ClientAttestationAuthFilter, so a deployment that gates the token endpoint with the filter never
  applies it. The broad defaults are David's decision (2026-08-24); the finding is that the opt-in route is
  ignored when the filter runs. S4c's AttestationPolicyResolver is shared by both routes; F-0041 (the
  properties are not declared) compounds this.
