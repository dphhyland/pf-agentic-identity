id: U-0019
title: The code grant ignores a narrower authorization_details parameter at the token endpoint
area: pf-integration
source: design
status: closed
plan_items: [S4d]
prs: [81]
recorded_in: the plan, To verify before relying on it, booted PingFederate item 4
verify_by: >
  On the rig: authorize with one set of details, redeem the code with a narrower set, and read what the token
  carries.
verification: >
  S4D1's rig run of 2026-09-30 (above; PR #81) showed the code and CIBA grants ignore a token-time
  authorization_details parameter in both directions, and S4D3's of the same day (pfai-p3-s4d3) saw the code grant
  redeemed with no parameter and the device grant - its verification page driven headless for the first time - each
  issue what was stored. The belt and the criterion rest on it: what is issued is held, wherever it was stored.
notes: >
  S4D1 drove it on the rig on 2026-09-30 (pfai-p3-s4d1, PingFederate 13.1.3), with the bridge assertion and no
  attestation filter in the way: PAR with sales_agent [EMEA, AMER] up to 500, the code redeemed with
  authorization_details [EMEA] up to 100, issued [EMEA, AMER] up to 500; PAR with [EMEA] up to 100 redeemed with
  [EMEA, AMER] up to 500, issued [EMEA] up to 100; redeemed with no parameter, issued what was pushed. CIBA the same:
  bc-auth with [EMEA, AMER] up to 500, polled with [EMEA] up to 100, issued [EMEA, AMER] up to 500. PingFederate
  ignores the token-time parameter on the code and CIBA grants in both directions, so the details are held where they
  are stored: S4D1's rewrite at PAR, CIBA and the device endpoint. Left open for S4D3, whose belt and criterion rest
  on it.
