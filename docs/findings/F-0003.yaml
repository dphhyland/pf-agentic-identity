id: F-0003
title: B3 RAR plugin has no trustworthy principal
severity: blocker
area: rar-paz-plugin
source: review-2026-09-26
status: open
plan_items: [S-2, S2a, S2b]
prs: []
verification: ''
target_release: 0.4.0
notes: >
  `...rar.resource_owner_sub` is never set, so the PDP decides without a principal. PingFederate 13.1.3's
  AuthorizationDetailContext.getUserKey() (javap-verified; absent from 13.0.0.3) is the way to one, but what
  it carries differs per flow (F-0030): the client id under client credentials, null under token exchange. S2b
  resolves the principal per flow with a `principal_source`, denies payment_initiation and account_information
  without an authenticated principal, and makes `_principal_sub` and `login_hint` development-only.
