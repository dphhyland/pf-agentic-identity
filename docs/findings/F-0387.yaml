id: F-0387
title: The ldm SSF store writes attributes and records the Identity Object Model does not declare
severity: low
area: ssf
source: design
status: open
plan_items: [H-SSF-3]
prs: []
verification: ''
target_release: 0.7.0
notes: >
  Found 2026-09-30 by package HSSF2. The IOM (idp-scim-service, migrations 0001 and 002) declares no attribute for
  SSF 1.0's optional stream members and no class for a SCIM user record. The entry trigger checks MUST attributes only,
  so LdmSsfStore writes description, minVerificationInterval and inactivityTimeout on ssfStream (as it already wrote
  ownerClientId), and each SCIM user record as an ssfStreamSubject entry with no parent_id and scim-prefixed attributes;
  LdmSsfStoreOnPostgresTest holds both against the vendored 0000 and 0001 migrations. The model's validator reports the
  attributes as undeclared, and a parent-less ssfStreamSubject stretches that class's "membership by containment".
  Owner action: raise in idp-scim-service the MAY attributes ownerClientId, description, minVerificationInterval and
  inactivityTimeout on ssfStream, and a class for SCIM user records (or the scim* MAY attributes on ssfStreamSubject);
  LdmSsfStore then moves to it. We do not edit that repo from here (programme plan, Cross-repo).
