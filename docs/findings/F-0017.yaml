id: F-0017
title: SSF dead-letter drops events
severity: high
area: ssf
source: review-2026-09-26
status: open
plan_items: [S-10, S10c, S10d]
prs: []
verification: ''
target_release: 0.7.0
notes: >
  A SET that fails delivery is dead-lettered and lost rather than held. S-10: a paused stream's events are
  held (bounded by the TTL and 10,000 per stream), a stream-updated SET goes first on resumption, streams
  pause after 24 h of failure and not 75 s, and the operator can retry dead SETs.
