id: F-0033
title: Access-token mapping criteria can see context.OAuthAuthorizationDetails
severity: low
area: pf-integration
source: design
status: closed
plan_items: [S4d]
prs: [84]
verification: >
  Confirmed and used by S4D3 on the rig on 2026-09-30 (pfai-p3-s4d3, PingFederate 13.1.3): an access-token mapping's
  criteria and expressions see context.OAuthAuthorizationDetails, an AttributeValue whose object values are one
  LinkedHashMap per detail about to be issued, on the client-credentials, code, CIBA, device and refresh grants
  (U-0018). IssuedDetailsCriterion is the issuance-time check it makes possible.
target_release: 0.6.0
notes: >
  Found while designing, item 4. Design input rather than a defect: it makes an issuance-time check of the
  details actually issued possible, which S4d relies on. Low. Confirming it on a booted PingFederate is
  U-0018.
