id: F-0027
title: 'Observability: no metrics or health endpoints, audit gaps, DEBUG by default'
severity: medium
area: platform
source: review-2026-09-26
status: open
plan_items: [O-1, O-2, O-3, O-4, O-5, O-6]
prs: [43, 46, 49, 53, 68, 71, 76, 77, 80, 84, 85, 92, 96, 97]
verification: ''
target_release: 0.7.0
notes: >
  No health or metrics endpoint, attestation event codes that exist and are never emitted, no correlation ids,
  and DEBUG as the image's default log level. O-1 to O-4 (Phase 2): events in `platform` with a PII policy,
  metrics, health endpoints. O-2, O-5, O-6 (Phases 3 and 4): the new event families, a Prometheus endpoint,
  INFO by default with `trackingid` and `traceparent` correlation.

  Phase 2 (0.5.0, recorded 2026-09-29 by the release package) delivered O-1, O-3 and O-4 on F1's libraries (PR #43):
  O1 (PR #49) events in platform.events, every code and field catalogued with a PII class and held to the emitters by
  EventsCataloguedTest, PfAuditSink with the protocol column per component; O3 (PR #46) bounded counters, timers and
  gauges with one MXBean per loaded copy; O4 (PR #53) /agentic-identity/health/live and ready open, the detail and
  /info behind the static admin bearer, components registering at init, and every event counted. Still open: the
  attestation event codes are catalogued declaredOnly and not emitted (O-2), no Prometheus endpoint (O-5), DEBUG is
  still the image's default and there is no correlation id (O-6), and the PII classes are recorded but not applied
  (D-6).

  Phase 3 (0.6.0, recorded 2026-10-01 by the release package): O-2 is delivered, each family in a catalogue its
  package owns (decision 7): admin.* (S8A, PR #71), platform.* (PR5, PR #77), attestation.client.verified,
  attestation.client.refused and attestation.policy.invalid (S4C, PR #76), attestation.issued.refused (S4D3, PR
  #84), attestation.challenge.* (ST5A, PR #80), gm.* (ST5S, PR #85), rar.decision.* (PLG, PR #92), ssf.* (HSSF3, PR
  #97) and fapi.request.refused (HFEDE, PR #96), which also gives each refusal to an unauthenticated caller a
  reference that server.log carries. RI3 (PR #68) made INFO the image's default (part of O-6). Still open: a
  Prometheus endpoint (O-5), the rest of O-6, and the PII classes applied (D-6).
