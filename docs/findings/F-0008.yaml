id: F-0008
title: The admin API accepts a static bearer token
severity: high
area: pf-integration
source: review-2026-09-26
status: open
plan_items: [S-8, S8a, S8b]
prs: [71]
verification: ''
target_release: 0.6.0
notes: >
  `OIDF_AUTHORITY_ADMIN_TOKEN` is one shared secret for the hosted-entity admin API, and the other operator
  surfaces are no better. S-8 moves them onto PingFederate-issued OAuth access tokens (JWT or introspection),
  a scope per surface, DPoP required in production and the actor taken from the token; the static token
  becomes development-only. PR 71 (S8a, 2026-09-30) builds OperatorAuthenticator in platform-pf and nothing
  uses it yet; S8b moves the surfaces onto it and closes this.
