id: F-0005
title: B5 SSF push can stall completely
severity: blocker
area: ssf
source: review-2026-09-26
status: mitigated
plan_items: [S10-0, S-10, S10a, S10b, S10c, S10d]
prs: [28]
verification: >
  S10-0 (PR #28): dueForPush joins the stream's state
  in all three stores, and the two JOINs run against Postgres 16.14 in SsfStoresOnPostgresTest, which CI runs
  (U-0078); a stream whose delivery fails waits out its first SET's backoff as a whole, so a receiver that is
  down costs one attempt per backoff step and the SET that failed goes first, a burst of one second's SETs
  included, the rest by issuedAt and then jti (PushDeliveryServiceTest, SsfStoresOnPostgresTest; the order
  within a second is F-0095); connect 2 s,
  exchange 10 s, body 4 KiB, and the connection closed at the deadline (PushDeliveryHttpTest, U-0077); the loop
  started from SsfSupport.start at boot (SsfBootstrapTest) and a store that is down retried every 30 s
  (SsfSupportBootTest). On the rig 2026-09-27 (PingFederate 13.1.3, the branch's jars at e858f9e): the loop's
  start line at 03:41:43,415 UTC, the 9031 listener at 03:41:45,160, `PingFederate started` at 03:41:45,742;
  and with the store's database down at boot, PingFederate served, SSF answered 500, and the retry 30 s later
  opened the store and started the loop. Mitigated, not closed: one thread, no leases and no fairness between
  enabled streams until S-10 (Phase 4).
target_release: 0.7.0
notes: >
  One oldest-first batch of 500 across every stream starves push; HttpClient.newHttpClient() has no timeouts
  and runs on a single-thread loop; the loop starts only when a management servlet first initialises. S10-0
  (Phase 1) selects only enabled push streams, gives the client timeouts and starts the loop from the
  load-on-startup servlet, which mitigates it; S-10 (Phase 4) is the leased delivery engine. Push delivery has
  never been run against the conformance suite: it needs a suite that PingFederate can call back.
