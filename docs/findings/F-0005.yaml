id: F-0005
title: B5 SSF push can stall completely
severity: blocker
area: ssf
source: review-2026-09-26
status: mitigated
plan_items: [S10-0, S-10, S10a, S10b, S10c, S10d]
prs: []
verification: >
  S10-0 (branch prod/p1-stopgaps, PR number filled in when it is opened): dueForPush joins the stream's state
  in all three stores (PushDeliveryServiceTest#aPausedStreamsBacklogDoesNotKeepAnEnabledStreamFromDelivering),
  one failed attempt per stream per tick, connect 2 s / exchange 10 s / body 4 KiB (PushDeliveryHttpTest), the
  loop started from SsfSupport.start at boot (SsfBootstrapTest) and a store that is down retried every 30 s
  (SsfSupportBootTest). Boot order seen on the rig 2026-09-27 (13.1.3.0): the loop's start line at 02:29:11,125
  UTC, the 9031 listener at 02:29:13,764, `PingFederate started` at 02:29:14,728. Mitigated, not closed: one
  thread, no leases and no fairness between enabled streams until S-10 (Phase 4).
target_release: 0.7.0
notes: >
  One oldest-first batch of 500 across every stream starves push; HttpClient.newHttpClient() has no timeouts
  and runs on a single-thread loop; the loop starts only when a management servlet first initialises. S10-0
  (Phase 1) selects only enabled push streams, gives the client timeouts and starts the loop from the
  load-on-startup servlet - the status becomes mitigated when it merges; S-10 (Phase 4) is the leased delivery
  engine. Push delivery has never been run against the conformance suite: it needs a suite that PingFederate
  can call back.
