id: U-0400
title: That PingFederate 13.1.3 believes its client IP header from any sender, and rewrites getRemoteAddr() to it
area: platform
source: design
status: open
plan_items: [H-ATT-3]
prs: []
recorded_in: libs/platform/README.md, net (PingFederate's own proxy settings)
verify_by: >
  On the rig, set the incoming proxy settings' forwardedIpAddressHeaderName to X-Forwarded-For with index LAST, send
  requests to /federation/attestation/challenge carrying different X-Forwarded-For values straight to PingFederate (no
  proxy), and confirm each is counted as the header's last value; then with index FIRST, as its first; then unset,
  as the sender's address (F-0116's 2026-09-27 result already shows the unset case).
verification: ''
notes: >
  Read with javap on 2026-09-30 from the pinned image's server/default/lib/pf-appserver-ext.jar:
  com.pingidentity.appserver.jetty.server.customizer.ForwardedRequestCustomizer, which etc/jetty-runtime.xml adds to
  the runtime connector, reads MetadataLocal's getCustomGlobalHttpHeaderName and getClientIpHeaderIndex (FIRST or
  LAST) and getForwardedHostHeaderName and its index, takes that value of the header, and builds the request's
  remote address from it, with no check of the sender; with neither header named and proxyTerminatesHttpsConns
  false it returns the request unchanged. LocalSettings sets no default for them. bin/run.properties has only
  outbound (forward) proxy properties. So TrustedProxies cannot defer to PingFederate; the README gives the two
  configurations that work. Were the customiser to behave otherwise at run time, the configuration advice would
  change, not the class.
