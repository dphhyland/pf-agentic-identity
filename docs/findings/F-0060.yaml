id: F-0060
title: 'Issuance endpoint: no body cap or rate limit, every PingFederate client enumerated per request, internal URLs in errors'
severity: medium
area: attestation-issuer
source: reviewer-report
status: closed
plan_items: [H-ATT-2]
prs: [89]
verification: >
  2026-09-30, branch prod/p3-issuance-endpoint (HATT2): POST /federation/attestation counts each client address
  (OIDF_ATTESTER_ISSUANCE_REQUESTS_PER_MINUTE, 60; in Redis under oidf:cas:limit:issue when OIDF_REDIS_URL is set,
  else per node) and answers 429 temporarily_unavailable with Retry-After past it; reads at most
  OIDF_ATTESTER_MAX_BODY_BYTES (32768) and answers 413 invalid_request beyond it without reading on; matches evidence
  against ClientBindingIndex, rebuilt every OIDF_ATTESTER_CLIENT_INDEX_REFRESH_SECONDS (30) and after a miss at most
  once in 5 s, and served for at most four intervals while rebuilds fail, instead of enumerating PingFederate's clients
  per request; and answers every failure its own code, an unexpected exception or Error included, with an
  X-Correlation-Id header, and for a 5xx or invalid_client a fixed description with no internal URL, the detail logged
  at WARN under the id. Every code it answers is CAS section 4.6's but three kept from before 0.6.0 (invalid_svid,
  spiffe_id_not_authorized, invalid_client at 400), which F-0392 records; the 2026-09-30 review found none of their
  descriptions names an internal URL.
  IssuanceRequestPathTest (body cap, limit with a fake clock and with the CI Redis, each failure's text),
  ClientBindingIndexTest (one read for a hundred requests, a thousand misses in ten seconds rebuilding twice, the
  staleness bound, two stale reads sharing one rebuild) and the attestation-issuer coverage gate hold it, on JDK 17
  and 21. Not exercised on the rig.

target_release: 0.6.0
notes: >
  From the seven reviewer reports of 2026-09-26, as Workstream H of the plan lists it (Phase 3). Medium by the
  register's rule for these items. H-ATT-2: a body cap and a rate limit, a cached client-binding index,
  catch-all error handling with CAS section 4.6 errors and no internal URLs.
