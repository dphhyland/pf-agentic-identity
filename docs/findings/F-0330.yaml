id: F-0330
title: The image ships no PostgreSQL JDBC driver, so OIDF_SSF_JDBC_URL cannot open a store in it
severity: low
area: ssf, build
source: design
status: open
plan_items: [ST-5]
prs: [82]
verification: ''
target_release: 0.6.0
notes: >
  Found by ST5C on the rig (2026-09-30, slot 3, PingFederate 13.1.3.0, the conformance profile's image). With
  OIDF_SSF_JDBC_URL=jdbc:postgresql://..., PfJdbcStoreFactory's DriverManagerDataSource loads org.postgresql.Driver by
  name and found none: "JDBC driver org.postgresql.Driver not on the classpath" (a ClassNotFoundException), and no
  postgresql*.jar is anywhere in the container. From 0.6.0 that is SSF FAILED_CONFIG with the ERROR naming it, and it
  is not retried; until 0.6.0 it was retried every 30 s for ever. A PingFederate data store id
  (OIDF_SSF_DATA_STORE_ID) is unaffected: PingFederate loads the driver its data store names, from the operator's
  server/default/lib. The direct URL is forbidden in production, so only development and the rig meet this; the rig's
  SSF store is in memory. Copying the driver into server/default/lib (done by hand for this run) let the store open.
  Who and when: not allocated - the release package decides whether the image carries the driver for the direct URL
  or the direct URL's documentation says to add it.
