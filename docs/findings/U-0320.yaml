id: U-0320
title: A production-profile PingFederate lets a DPoP-bound operator token through its operator routes and refuses an unbound one
area: platform-pf, pf-integration
source: design
status: open
plan_items: [S8b]
prs: [75]
recorded_in: docs/releases/unreleased/S8B.md, Notes
verify_by: >
  On a rig built from this repository in the production profile (data.zip.age), with OIDF_OPERATOR_JWKS_URL (or the
  introspection endpoint) reachable over TLS the JVM trusts, run services/device-enrolment's AuthorityCredentialsRigTest
  with profile production (a DPoP-bound client-credentials token enrols a hosted entity; an unbound one is never
  sent), and send an unbound token from a client without Require DPoP to POST /federation/agents: 401 invalid_token.
verification: ''
notes: >
  S8B (2026-09-30) showed the development half on the rig and the production refusal of the static bearer, but not
  this. In production the rig's self-signed certificate on https://localhost:9031 could not be made trusted for the
  operator authenticator's JWKS fetch: -Djavax.net.ssl.trustStore with the certificate added, and the certificate
  imported as a PingFederate Trusted CA, both left "PKIX path building failed" in the refusal (platform's
  TlsTrust.jvmDefault uses SSLSocketFactory.getDefault()); OIDF_OPERATOR_INSECURE_TLS is forbidden in production and
  the plain HTTP listener is refused there by the image. Which trust SSLSocketFactory.getDefault() answers inside
  PingFederate 13.1.3 is itself worth knowing: a deployment whose JWKS or introspection endpoint has a private CA
  meets the same question (U-0321). The production checks themselves - an unbound token refused, the binding checked -
  are rs-validation's and the authenticator's, unit-tested, and S8A's rig test let PingFederate's own DPoP-bound
  tokens through the authenticator (development profile, 2026-09-30).
