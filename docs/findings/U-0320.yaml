id: U-0320
title: A production-profile PingFederate lets a DPoP-bound operator token through its operator routes and refuses an unbound one
area: platform-pf, pf-integration
source: design
status: closed
plan_items: [S8b]
prs: [75]
recorded_in: docs/releases/unreleased/S8B.md, Notes
verify_by: >
  On a rig built from this repository in the production profile (data.zip.age), with OIDF_OPERATOR_JWKS_URL (or the
  introspection endpoint) reachable over TLS the JVM trusts, run services/device-enrolment's AuthorityCredentialsRigTest
  with profile production (a DPoP-bound client-credentials token enrols a hosted entity; an unbound one is never
  sent), and send an unbound token from a client without Require DPoP to POST /federation/agents: 401 invalid_token.
verification: >
  Shown 2026-10-01 AEST (2026-09-30T21:26Z-21:32Z UTC) by the v0.6.0 release package on the conformance rig
  (PingFederate 13.1.3.0, modules at origin/main 600fa6b5, OIDF_DEPLOYMENT_PROFILE=production, the archive baked in as
  data.zip.age, OIDF_OPERATOR_API_ENABLED=true, jwt mode against PingFederate's own JWKS). Operator clients were added
  to a development copy of the rig through its admin API and the archive exported: one with Require DPoP and the route
  scopes, one with Require DPoP and no route's scope, one without DPoP. Every one of the 33 operator routes
  (OperatorRoutes and pf-integration's OperatorApi: the federation admin API, enrolment and removal under
  /federation/agents and /federation/resources, /federation/registered-clients, the health detail and /info) was
  called with four credentials, 132 calls, on a fresh container and again after docker restart of the same one: the
  old static bearer 401 with a DPoP challenge 33/33; an unbound PingFederate token 401 invalid_token, 'access token
  carries no cnf, so it is not sender-constrained', 33/33; a DPoP-bound token without the route's scope 403
  insufficient_scope 33/33; with it 30/33 2xx, including POST /federation/agents 201, and three refused by their
  handlers after authentication (a defect, F-0437, and two that need a second hosting key or a retired key). A
  DPoP-bound token sent as Bearer, or with another key's proof, was 401. A boot with OIDF_AUTHORITY_ADMIN_TOKEN set
  answered 503 to all 132 calls, OPERATOR_API and HOSTING REFUSED with 'Unset OIDF_AUTHORITY_ADMIN_TOKEN', before and
  after a restart. The enrolment route was driven directly, not through device-enrolment's
  AuthorityCredentialsRigTest. The JWKS was served over plain http from the host in the matrix runs; U-0321 shows the
  https case.
notes: >
  S8B (2026-09-30) showed the development half on the rig and the production refusal of the static bearer, but not
  this. In production the rig's self-signed certificate on https://localhost:9031 could not be made trusted for the
  operator authenticator's JWKS fetch: -Djavax.net.ssl.trustStore with the certificate added, and the certificate
  imported as a PingFederate Trusted CA, both left "PKIX path building failed" in the refusal (platform's
  TlsTrust.jvmDefault uses SSLSocketFactory.getDefault()); OIDF_OPERATOR_INSECURE_TLS is forbidden in production and
  the plain HTTP listener is refused there by the image. Which trust SSLSocketFactory.getDefault() answers inside
  PingFederate 13.1.3 is itself worth knowing: a deployment whose JWKS or introspection endpoint has a private CA
  meets the same question (U-0321). The production checks themselves - an unbound token refused, the binding checked -
  are rs-validation's and the authenticator's, unit-tested, and S8A's rig test let PingFederate's own DPoP-bound
  tokens through the authenticator (development profile, 2026-09-30).
