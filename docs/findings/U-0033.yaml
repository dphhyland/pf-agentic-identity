  the plan, To verify before relying on it, verbatim from the primary source, SSF, CAEP and SET transport
verify_by: Quote the section verbatim from the primary source before the code or the docs assert it.
verification: >
  2026-09-28, PR #61 (package XA14): OpenID Shared Signals Framework Specification 1.0, published 29 August 2025,
  fetched from openid.net/specs/openid-sharedsignals-framework-1_0.html and read verbatim. §3.3: "A Complex Subject
  Member has a name and a value that is a JSON [RFC7159] object that has a format field, and one or more Simple
  Subject Members. The name of the format field is "format", and its value is "complex"." The member names it lists
  are user, device, session, application, tenant, org_unit and group, each "OPTIONAL. A Subject Identifier", and
  "Additional Subject Member names MAY be used in Complex Subjects. Each member name MAY appear at most once". §3.2:
  a Simple Subject Member's value "is a "Subject Identifier" as defined in ... [RFC9493]". §3.3.1: "All members within
  a Complex Subject MUST represent attributes of the same Subject Principal." §8.1.3.1 gives the matching rule
  (members undefined on either side match) with three worked examples. libs/shared-signals' SubjectId parses,
  writes, keys and matches complex subjects to that text; ComplexSubjectTest pins it with the section's Figure 2 and
  §8.1.3.1's three examples. What a complex subject is, is settled; wiring the receiver and the stream store to act
  on one is still H-SSF-1 (Phase 3) - servlets/ssf refuses complex subjects from outside, as before, until then.
