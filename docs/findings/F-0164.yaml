id: F-0164
title: A plugin's insecure-TLS use is recorded in its own relocated copy, where the start-up audit cannot see it
severity: low
area: platform, rar-paz-plugin
source: design
status: open
plan_items: [F-2, PR-5]
prs: []
verification: ''
target_release: 0.7.0
notes: >
  InsecureTls records each use in a static of the copy that was loaded (PR1, 2026-09-28), and statics are per
  loader (docs/development/classloaders.md). The RAR plugin shades and relocates platform, so when its "Skip
  TLS verification (dev only)" field is honoured the use lands in
  com.pingidentity.ps.oidf.rar.shaded.platform.tls.InsecureTls, which the webapp's lifecycle listener (F-2)
  does not load. The WARN still reaches server.log; the audit's list of uses would not include it. F2 decides
  how the audit learns of a plugin's use - for example through the per-loader MXBean O3 registers, or by
  reading the plugin's configuration - or says in the banner that plugins report only in the log.

  Retargeted from 0.5.0 to 0.6.0 on 2026-09-29, still open. F2 (PR #57) built the start-up audit and did not settle
  this: its insecure TLS line lists "each setting that turned certificate or host-name checking off in this war"
  (docs/operator/startup-audit.md), read from the war's own copy of InsecureTls, so a plugin's use still reaches only
  server.log, as its WARN. PR-5 (0.6.0), which turns the audit into refused components, is where the audit has to
  learn of a plugin's use or say that it cannot.

  Retargeted from 0.6.0 to 0.7.0 on 2026-10-01 by the v0.6.0 release package, still open on origin/main 600fa6b5:
  PR5 (PR #77) turned the start-up audit into refused components but did not teach it a plugin's use of its
  relocated InsecureTls; docs/operator/startup-audit.md still lists the war's own copy's uses, and a plugin's use
  reaches only server.log as its WARN. In production the RAR plugin refuses "Skip TLS verification (dev only)" on
  save and at configure (PLG, PR #92), so the gap is the development profile's. The programme plan gives it no later
  item of its own, so David schedules it.
