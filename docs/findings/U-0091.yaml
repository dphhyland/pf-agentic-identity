id: U-0091
title: 'Check run ids rise in the order the runs are created, so the release gate''s highest id is the newest run'
area: release, ci
source: pr-review
status: open
plan_items: [P0-6]
prs: []
recorded_in: 'release.yml, the step "a green Build on this commit" (the sort on the id), and the prod/p1-release-gate-waits pull request''s Unverified list'
verify_by: >
  GitHub's REST reference gives a check run's `id` as an int64 and says nothing of its order ("List check runs
  for a Git reference", read 2026-09-27). Settled by GitHub saying so, or by reading `filter=all` on commits
  with a re-run and with a second Build and finding the newest run with the highest id each time.
verification: ''
notes: >
  Of several check runs with one name on the tagged commit, the gate judges the one with the highest id. On the
  two commits read on 2026-09-27 the newer run had the higher id: on 97e5650 the re-run of the release job
  (started 2026-09-27T00:08:10Z) is 108514273867 and its first attempt (2026-09-26T23:12:31Z) 108506315735; on
  5d7c30f the push Build's `java` (2026-07-30T23:55:06Z) is 91036058577 and the pull request Build's
  (23:33:11Z) 91032682013. If ids did not rise with creation, the gate could judge a superseded run of a job on
  the same commit, as the step did before 0.4.0 whenever a commit had two (the API lists newest first and it
  took the last) - a stale verdict, but never one about a commit Build did not run on.
