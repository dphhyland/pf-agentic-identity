notes: >
  From the seven reviewer reports of 2026-09-26, as Workstream H of the plan lists it (Phase 3). Medium by the
  register's rule for these items. ClientEntityAuthorizer, fetchMembers and fetchEntityConfiguration (/list),
  dead FederationConfiguration methods, deprecated overloads, BridgeSigners.require, public resetForTests. The
  exposure is maintenance, not security; medium is the rule, not a judgement of risk.
  ST5F (PR #91, 2026-09-30) removed FederationConfiguration's dead methods - trustControllerHost(),
  trustAnchorIssuers(), defaultTrustAnchorIssuer(), findTrustAnchor(String), the 4-, 9- and 10-argument
  constructors and the trustControllerHost field - with the greps in the PR body showing them unused; the rest of
  H-FED-10 is HFEDD's, and this finding stays open for it.
