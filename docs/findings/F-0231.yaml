id: F-0231
title: 'The settings catalogue cannot record a removed plugin field, such as the RAR plugin''s "Deny unless PERMIT"'
severity: low
area: platform, rar-paz-plugin
source: design
status: closed
plan_items: [ST-5, PR-3]
prs: [62]
verification: >
  2026-09-30, package PLG: rar-pdp-processor.json lists "Deny unless PERMIT" under removed, from plugin-field,
  release 0.4.0, no replacement (PR5's form), so the settings scan and the generated
  docs/configuration/rar-pdp-processor.md show it. The plugin still ignores a stored value rather than refusing it:
  ProcessorConfigurationTest.theDenySwitchIsGoneAndAStoredValueIsIgnored configures an instance holding it under
  the production profile and asserts the catalogue's removed entry. The generated page's generic sentence that a
  removed name is refused is wrong for this field: F-0375.
target_release: 0.6.0
notes: >
  Found by ST3B (2026-09-28). The RAR plugin's "Deny unless PERMIT" field went in 0.4.0 (S2a; the item "'Deny unless PERMIT' is gone" in
  docs/releases/0.4.0.md), and its catalogue was to record it as a removed name. platform.settings' loader takes a removed entry
  only from env, system-property or init-param (Catalogue's reader refuses any other "from"), and a removed
  name is refused when it is set - but the plugin deliberately ignores a stored value under the old field, so that
  a 0.3.0 archive still imports and decides (verified on the rig, 2026-09-27, per AttestationAwareRarProcessor's
  DENY_ON_NON_PERMIT_REMOVED). Recording it needs a removed kind for plugin fields whose meaning is "ignored" rather
  than "refused", decided with ST-5 (which converts the readers) or PR-3 (the plugin GUI rules). Until then the
  plugin's README says why the catalogue does not list it.
