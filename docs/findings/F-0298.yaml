id: F-0298
title: A governed init-param, plugin field or extended property is refused only once its reader reads through the catalogue
severity: medium
area: platform, openid-federation, rar-paz-plugin, instance-registry-datasource
source: design
status: open
plan_items: [PR-5, ST-5, PR-3]
prs: [77]
verification: ''
target_release: 0.6.0
notes: >
  Found by PR5 (2026-09-30). The start-up sweep reads the environment and the system properties only; an init-param,
  a plugin's field and a client's extended property reach their readers from PingFederate. PR5 refuses them at read:
  a Settings read whose value came from an init-param, and Settings.parse of a plugin field or extended property,
  throw ProfileRefused under production. No reader of such a governed entry reads through Settings yet, so
  openid-federation's init-param ignoreSslErrors, the RAR plugin's "Skip TLS verification (dev only)", "Trust a
  client-asserted principal" and "Fail open on engine error" fields, the instance registry's "JDBC URL" field, and
  OIDF_FEDERATION_RESOLVE_DISCOVERY given as the init-param resolveDiscovery are not refused yet. Who and when: ST5F
  converts FederationConfiguration, PLG the RAR plugin's GUI and configure, ST5S the instance registry datasource.
