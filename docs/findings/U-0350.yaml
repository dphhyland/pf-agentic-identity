id: U-0350
title: That PingFederate 13.1.3 verifies an encrypted request object's inner signature against the client's registered keys
area: pf-integration
source: design
status: open
plan_items: [H-FED-1]
prs: [78]
recorded_in: servlets/pf-integration/README.md, Endpoints (OidfFrontChannelAutoRegistration); docs/federation/limits.md
verify_by: >
  On the rig, register an RP at the authorization endpoint with a signed request object (development or production),
  then send a request object signed with a key the RP did not register, encrypted to PingFederate's request-object
  encryption key: PingFederate refuses it. Send the same request object signed with the registered key: it goes ahead.
verification: ''
notes: >
  This module cannot decrypt a request object (it is encrypted to PingFederate), so for a registered RP whose
  registration is current it passes an encrypted one on unread, and the docs say PingFederate decrypts it and checks
  the signature inside against the registered keys - with requireSignedRequests set on every RP registered at the
  authorization endpoint. Nobody has shown that on 13.1.3. If PingFederate accepted an unsigned or wrongly signed
  inner request, a registered RP's encrypted requests would demonstrate nothing, and §12.1.1 would need them refused
  too (OIDF_AUTO_REGISTRATION_ENCRYPTED_REQUEST_OBJECTS=refuse does that today).
