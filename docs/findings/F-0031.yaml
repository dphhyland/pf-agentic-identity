id: F-0031
title: A refresh that restates authorization_details is held to its grant on type and five array fields only
severity: high
area: rar-paz-plugin, client-attestation
source: design
status: closed
plan_items: [S-1, S1c]
prs: [36]
verification: >
  2026-09-27, PR #36 (branch prod/p1-rar-plugin-model). javap -c of pf-protocolengine and pingfederate-sdk
  13.1.3.0: RefreshTokenGrantProcessor.processGrant compares a refresh only when it carries
  authorization_details - it enriches the requested details with the grant's user key, then asks the processor,
  per same-type pair, whether each requested detail is within a stored one (AuthorizationDetailsServiceImpl and
  AuthorizationDetailsUtil.isEqualOrSubset: copies of both details, a context with no user key, an empty
  parameter map) and answers invalid_authorization_details on a no; without the parameter it reissues the
  stored details and enriches nothing (F-0105). The plugin's isEqualOrSubset is now the containment model's
  strict contains with the grant as the ceiling (ModelContainmentTest aRefreshMayAskForLessAndNeverForMore: an
  amount above the grant, another currency, another payee and an omitted constrained field are all refused), and
  RefreshVectorsTest runs the library's 148 contains cases through that refresh loop and PingFederate's own
  parse, six listed divergences apart, none of which issues more than the grant; both on JDK 20.0.2 and 17.0.11.
  On the rig (pfai-s1c, PingFederate 13.1.3.0, 2026-09-27T09:33Z) a CIBA grant for 42.00 AUD to Acme refused
  a refresh for 43.00 and one for another payee with 400 invalid_authorization_details, and granted one for
  41.00; RarContainment compared neither the amount nor the payee.
target_release: 0.4.0
notes: >
  Found while designing, item 2, and filed as "A refresh with no authorization_details reissues the stored
  details and never re-asks the PDP"; retitled on 2026-09-27 (PR #36) to the half S1c closes, with the other
  half split to F-0105. PingFederate enriches the requested detail and then calls isEqualOrSubset without a
  user key. High: the refresh path extends B1's lenient containment to every renewal, and a policy change
  between issuance and refresh is never seen. S-1 makes refresh's isEqualOrSubset a strict `contains`. Closed
  by S1c for the refresh the processor is asked about: a refresh that restates authorization_details is
  enriched (the PDP is asked again, and may only narrow) and must then be within the grant by the model. The
  original title's half is PingFederate's own: a refresh without authorization_details reissues the stored
  details and enriches nothing, so the PDP never sees it, and the processor is asked about it only where
  approved consent is reused, and then whether the details are within the consent, not the grant (RFC 9396
  section 7 leaves those details "at its discretion" to the AS). That residual - a policy change after
  issuance, and details stored before 0.4.0, carried to every bare refresh - is F-0105.
