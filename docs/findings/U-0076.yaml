id: U-0076
title: What the container does when the load-on-startup SSF servlet's init throws
area: ssf
source: design
status: closed
plan_items: [S10-0, S-10]
prs: [28]
recorded_in: the S10-0 pull request's Unverified list; servlets/ssf/README.md, Boot
verify_by: >
  Boot the rig on the 0.3.0 jars with storeDialect=tables and a jdbcUrl no database answers, and read what
  PingFederate serves: every runtime endpoint 503 (the merged pf-runtime.war failed to start) or only the SSF
  ones. Then the same on 0.4.0 to see the retry line instead.
verification: >
  Every runtime endpoint 503. Seen on the rig 2026-09-27 (PingFederate 13.1.3, pf-runtime.war merged with the
  branch's jars at e858f9e): with OIDF_FEDERATION_TRUST_ANCHORS unset, OpenIdFederationServlet's init
  (loadOnStartup=1) threw, Jetty ee9 logged "Failed startup of context" for pf-runtime.war, and discovery,
  /as/token.oauth2, /pf/heartbeat.ping and the SSF and federation endpoints on 9031 all answered 503 while the
  admin console on 9999 answered 200. SsfConfigurationServlet's init is called on the same path
  (ServletHandler.initialize, as the stack in the next boot's log shows), so a store error escaping it, as on
  0.3.0, took the whole war down; the 0.3.0 jars themselves were not booted. The 0.4.0 half: with a tables
  store whose database came up after boot, PingFederate served (discovery, heartbeat, federation 200), SSF
  answered 500, and the retry 30 s after the ERROR opened the store and started the push loop.
notes: >
  "Found while designing" 11 says a boot-time DB error escaped SsfConfigurationServlet.init. S10-0 assumed,
  from Jetty ee9's ServletHandler.initialize collecting a load-on-startup servlet's init exception and failing
  the context, that this took the whole runtime web application down. Recorded 2026-09-27; the rig answered
  the same day. U-0023 asked the same question of any load-on-startup servlet, and the same boot answers it.
