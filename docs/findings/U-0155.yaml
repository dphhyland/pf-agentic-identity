id: U-0155
title: Whether the reactor's tests pass on JDK 21, which PingFederate's image runs, when CI tests on 17
area: ci
source: design
status: open
plan_items: [R-CI5]
prs: []
recorded_in: docs/releases/unreleased/RCI5.md, Notes
verify_by: >
  Run the reactor's tests on JDK 21 - `mvn -B verify` under Temurin 21 with the java job's Postgres and Redis
  variables, or inside the pinned pingidentity/pingfederate image's own java - and compare the surefire totals
  and the coverage gates with the JDK 17 run of the same commit. Then either add a second test run on JDK 21
  to Build's java job on pushes to main (actions/setup-java with java-version 21 after the coverage steps,
  measuring what it adds to the job's roughly five minutes), or record why one JDK is enough.
verification: ''
notes: >
  The Phase 2 plan (2026-09-27) found that PingFederate 13.1.3's pinned image runs OpenJDK 21.0.12.1, checked
  with `java -version` inside it, while CI tests on Temurin 17 and this Mac builds on 20; a behaviour that
  depends on the JDK's TLS, networking or reflection could pass here and differ in the image. Package RCI5
  was asked to add the JDK 21 run if the java job's time allowed, and records it instead: a second
  `mvn verify` step would repeat the Postgres and Redis variables of the reactor build step, which package DB1
  rewrites in the same wave, and this Mac has no JDK 21 to measure it with (2026-09-28). The java job took
  5 min 16 s on main's run 36324936104 and 4 min 8 s on 36326146100 (both 2026-09-27).
