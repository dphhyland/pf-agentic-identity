id: F-0182
title: CI's guard against skipped live Redis tests reads only client-attestation's report
severity: low
area: ci, platform
source: pr-review
status: open
plan_items: [C-2]
prs: []
verification: ''
target_release: 0.6.0
notes: >
  Found by C2's review (2026-09-28). build.yml's java job fails when client-attestation's RedisLiveTest skips a
  test or runs none, but it does not read libs/platform's RedisLiveTest report, and that is the only test that runs
  the lease and rate-limit scripts (compare-and-delete, compare-and-extend, the fixed window) and the TLS rules
  against a real Redis. If its OIDF_TEST_REDIS_* variables stopped reaching it the job would stay green. It runs
  today: Build run 36345506046 shows 8 tests, 1 skipped (the Sentinel test, which needs a Sentinel CI does not
  start). build.yml was outside C2's files; whoever next owns the java job extends the guard to platform's report,
  allowing that one Sentinel skip.
