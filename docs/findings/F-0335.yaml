id: F-0335
title: The federation endpoints' and automatic registration's attestation-store state stays in memory in production without the in-memory-state risk
severity: medium
area: pf-integration, client-attestation
source: design
status: open
plan_items: [PR-2]
prs: []
verification: ''
target_release: 0.6.0
notes: >
  Found by ST5A (2026-09-30) while wiring PR-2's in-memory rule. AttestationSupport.requireSharedState(namespace) is
  the rule (Phase 3 plan, decisions 9 and 15), and ST5A calls it from the parts that own the attestation namespaces:
  the authorization server's challenge endpoint (oidf:as:*, refusing ATTESTATION_AUTH) and the attester's issuance
  servlet and challenge endpoint (oidf:cas:*, refusing ATTESTATION_ISSUER). Two other users of these stores keep
  in-memory state in production without the risk, because their classes are not ST5A's: OpenIdFederationServlet's
  federation-endpoint client authentication (AttestationSupport.replayCache(StoreNamespace.FED_ENDPOINT),
  oidf:fed:endpoint:*, component FEDERATION), and FrontChannelAutoRegistrationFilter's request-object and assertion
  jtis (AttestationSupport.replayCache(), the authorization server's oidf:as:* cache, component AUTO_REGISTRATION).
  The fix is one call each from their start functions - AttestationSupport.requireSharedState(FED_ENDPOINT) in
  OpenIdFederationServlet (ST5F rewrites that servlet's settings in wave 5), and a requireSharedState(AS) that refuses
  AUTO_REGISTRATION rather than ATTESTATION_AUTH (componentOf maps AS to ATTESTATION_AUTH; the filter's owner decides
  whether automatic registration gets its own namespace). Until then a production deployment without Redis replays
  a federation client assertion or an automatic registration request object on a second node.
