id: F-0430
title: The deprecated federation event façades still carry every federation emitter, so they stay until 1.0.0
severity: low
area: openid-federation, pf-integration
source: pr-review
status: open
plan_items: [O-2, H-FED-10]
prs: [99]
verification: ''
target_release: 1.0.0
notes: >
  Found by HFEDD on 2026-10-01 while listing every @Deprecated in main code (plan item H-FED-10), on origin/main
  e377dbae. FederationEvent, FederationEvents, FederationEventSink, LoggingEventSink and LogSafe in
  libs/openid-federation's federation.event package, and pf-integration's PfAuditEventSink, are
  @Deprecated(since = "0.5.0", forRemoval = true), and their javadoc said plan item O-2 (Phase 3) removes them. O-2
  was distributed (Phase 3 decision 7): new families went to platform.events, but the federation codes and their
  emitters did not move. FederationService, TrustMarkValidator, KeyHistory, RegistrationService, RegistrationPolicy,
  RegistrationExpirySweeper, HostedEntityServlet, HostedEntityAdmin, FederationAdminServlet, OIDFederationUtils,
  TokenIssuancePolicy and AttestationIssuanceServlet still emit through FederationEvents; seven servlets and filters
  install PfAuditEventSink; six classes use the façade LogSafe. Deleting them is a migration of every federation
  emitter onto platform.events, not dead-code removal, so HFEDD kept them and their javadoc now says removed at
  1.0.0 (plan Phase 7, with the other deprecated aliases). Low: the façades forward to platform and work; the cost is
  two event APIs to maintain.
