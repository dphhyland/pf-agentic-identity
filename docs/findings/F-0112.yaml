id: F-0112
title: The bridge signer cannot sign PS256 with an RSA key, so a client that wants PS256 fails every bridged request
severity: medium
area: oidf-jose, pf-integration
source: pr-review
status: open
plan_items: [H-JOSE-2]
prs: []
verification: ''
target_release: 0.6.0
notes: >
  Found on 2026-09-27 while verifying S4A (PR #34) on a booted PingFederate 13.1.3: LocalJwkSigner maps an RSA
  key's declared alg to a JCA algorithm for RS256, RS384 and RS512 only (LocalJwkSigner.java:56-62 at 10168b4) and
  throws "Unsupported RSA alg for signing: PS256" for anything else. BridgeSigners builds a client's signer when a
  bridged request first needs it, and keeps only one that builds (BridgeSigners.java:127-143), so an OIDF_BRIDGE_SIGNING_KEYS entry holding an RSA key declared PS256 - the conformance
  rig's conformance-ssf-receiver key, and what a client whose token endpoint signing algorithm is PS256 needs - is
  not refused at start: every attested request for that client answers 500 server_error after the attestation has
  verified, with "bridge signing key for <client> is not a usable private JWK" in server.log. PS256 is one of the
  three algorithms FAPI 2.0 permits. The attester's own signing key goes through the same class. Until it is fixed,
  an ES256 bridge key works (verified on the rig the same day). The fix: PS256, PS384 and PS512 for RSA keys, and a
  bridge key that cannot sign refused when BridgeSigners reads the file, not on first use.
