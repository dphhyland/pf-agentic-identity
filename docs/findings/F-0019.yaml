id: F-0019
title: Revoke race on hosted entities
severity: medium
area: openid-federation
source: review-2026-09-26
status: closed
plan_items: [H-FED-3]
prs: [88]
verification: >
  2026-09-30, package HFEDL. JdbcHostedEntityRegistry.setStatusIn updates WHERE entity_id = ? AND status = ? with the
  status it read and refuses a row count other than one as STALE_UPDATE, with nothing written; JdbcTrustMarkRegistry's
  grant and revoke do the same on the grant's status and granted_at (a first grant racing another is caught at the
  primary key), and JdbcKeyHistoryStore.revokeIn on revoked_at IS NULL. FederationAdminServlet answers STALE_UPDATE
  409 stale_update. On Postgres, two threads held at the update until both had read (Racing.meetingAt): two
  revocations, a suspension or a reactivation against a revocation, two revocations or reinstatements of a grant, a
  revocation against a grant again, two first grants and two key revocations each applied exactly one change and
  wrote one audit line (JdbcHostedEntityRegistryTest, JdbcTrustMarkRegistryTest, JdbcKeyHistoryStoreTest); with the
  hosted-entity update made unconditional again, the four hosted-entity races failed.
target_release: 0.6.0
notes: >
  State-machine updates (JdbcHostedEntityRegistry.java:141-157 at f95b522) are not conditional on the current
  status, so two operators can both revoke, or one revoke and one reactivate, without either noticing.
  H-FED-3: `WHERE status = ?` plus a row count, for hosted entities, Trust Mark grants and key revocation.
