notes: >
  State-machine updates (JdbcHostedEntityRegistry.java:141-157 at f95b522) are not conditional on the current
  status, so two operators can both revoke, or one revoke and one reactivate, without either noticing.
  H-FED-3: `WHERE status = ?` plus a row count, for hosted entities, Trust Mark grants and key revocation.
