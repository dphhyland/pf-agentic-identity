id: F-0197
title: The federation servlet and FederationRuntimeConfig read the same two variables from different sources
severity: medium
area: openid-federation, pf-integration
source: design
status: open
plan_items: [ST-5]
prs: []
verification: ''
target_release: 0.6.0
notes: >
  Found by ST3A (2026-09-28) while cataloguing: a name is catalogued once, so each variable's sources had to be
  written down in one place, and they differ by reader. FederationRuntimeConfig reads
  OIDF_FEDERATION_IGNORE_SSL_ERRORS and OIDF_FEDERATION_TRUST_CONTROLLER_HOST as system property, then
  environment variable, then the superseded OIDF_TRUST_CONTROLLER_IGNORE_SSL and OIDF_TRUST_CONTROLLER_HOST (with
  their system properties). The federation servlet's FederationConfiguration (libs/openid-federation) reads its
  init-params ignoreSslErrors and trustControllerHost, then the environment variable only. So
  -Doidf.federation.ignore.ssl.errors=true, or only the superseded name, turns certificate checks off for
  registration, the OGNL criteria and attestation but leaves them on for the federation servlet's own fetches
  (resolve, Trust Mark status), and the reverse with the init-param. Both read the switch leniently (anything but
  true is false). The catalogues record it as it is: federation-runtime owns the variables, and
  federation-entity's two init-param entries say they fall back to the environment only. ST-5 converts both
  readers onto one Setting.
